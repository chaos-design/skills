<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilingual Reader 域名预览</title>
    <style>
      :root {
        --ink: #141414;
        --muted: #667085;
        --line: #d0d5dd;
        --bg: #f6f7f9;
        --card: #fff;
        --accent: #0b5fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 48px 24px 72px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 34px;
      }
      p {
        margin: 0 0 26px;
        color: var(--muted);
        line-height: 1.7;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 14px;
      }
      a {
        display: block;
        min-height: 120px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
        transition: 0.18s;
        cursor: pointer;
      }
      a:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        box-shadow: 0 14px 32px rgba(16, 24, 40, 0.1);
      }
      strong {
        display: block;
        margin-bottom: 8px;
      }
      span {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }
      code {
        color: #344054;
        background: #eaecf0;
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bilingual Reader 域名预览</h1>
      <p>
        测试页按文章来源域名归档。每个域名目录下保留该来源的
        <code>data.json</code>
        、审查报告和模板 HTML 预览。
      </p>
      <div class="grid">
        <a href="openai/index.html">
          <strong>openai</strong>
          <span>A practical guide to building agents · 14 个模板预览</span>
        </a>
        <a href="anthropic/index.html">
          <strong>anthropic</strong>
          <span>Building effective agents · 4 个模板预览</span>
        </a>
        <a href="markdown-rendering/index.html">
          <strong>markdown-rendering</strong>
          <span>Markdown 渲染边界 fixture。</span>
        </a>
      </div>
    </main>
  </body>
</html>
