*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--c-bg,#111);}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;white-space:pre;color:var(--c-fg);font-family:var(--font);font-size:var(--fs);line-height:var(--lh)}
#stage>*{position:absolute}
b,.b{font-weight:700}
.tb{left:0;top:0;text-align:center;background:var(--c-bar);color:var(--c-dim)}
.tb i{position:absolute;border-radius:50%}
.sw{display:inline-block;width:.62em;height:.62em;margin-right:.55em;vertical-align:baseline}
.box{border-top:2px solid;border-bottom:2px solid}
.box::before,.box::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:repeating-linear-gradient(180deg,currentColor 0 calc(var(--lh) - 7px),transparent calc(var(--lh) - 7px) var(--lh))}
.box.solid{border:var(--bw,2px) solid currentColor;border-radius:var(--radius,0px)}
.box.solid::before,.box.solid::after{display:none}
.box.dashed{border-style:dashed}
.box::before{left:0}.box::after{right:0}
.box .ln{color:var(--c-fg);height:var(--lh);padding-right:0}
.ln.flex{display:flex;align-items:center}
.ln.flex>div{overflow:visible}
.wire{background:var(--c-line)}
.dashv{background:repeating-linear-gradient(180deg,var(--c-line) 0 5px,transparent 5px 9px)}
.dashh{background:repeating-linear-gradient(90deg,var(--c-line) 0 5px,transparent 5px 9px)}
.pk{border-radius:50%;width:12px;height:12px;margin:-6px 0 0 -6px;display:none}
.pk.s{width:6px;height:6px;margin:-3px 0 0 -3px}
.bar{position:relative;display:block;height:20px;background-image:radial-gradient(var(--c-dots,#566078) 1px,transparent 1.3px);background-size:4px 4px}
.bar u{position:absolute;left:0;top:0;bottom:0;text-decoration:none}
.bar u.end::after{content:"";position:absolute;right:0;top:0;bottom:0;width:8px;background:repeating-conic-gradient(var(--c-bg) 0 25%,transparent 0 50%) 0 0/4px 4px;opacity:.55}
.bar s{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--c-fg);text-decoration:none}
.cur{display:inline-block;width:.62em;height:1.05em;vertical-align:-.18em;margin-left:.4em}
.tarrow{height:0;border-top:2px dashed var(--c-line)}
.glyph{text-align:center;line-height:1}
.logframe{border:2px solid var(--c-line2,#3a4154);border-top:0}
.logtop{height:0;border-top:2px solid var(--c-line2,#3a4154)}
.lgrow{position:absolute}
.lgrow span{position:absolute;top:0}
#err{position:absolute;left:10px;top:10px;color:#f66;font:14px monospace;white-space:pre-wrap;z-index:9}

  [x+tx,x+tx+tw].forEach(function(px){var t=document.createElement('div'); t.className='wire'; t.style.background='var(--c-line2,#3a4154)'; t.style.left=px+'px'; t.style.top=(y-10)+'px'; t.style.width='2px'; t.style.height='20px'; ST.appendChild(t)});
  var lab=document.createElement('div'); lab.style.left=(x+tx+18)+'px'; lab.style.top=(y-LH/2)+'px'; lab.style.height=LH+'px'; lab.style.color=cc('dim'); lab.textContent=e.title||'log'; lab.setAttribute('data-t','text'); ST.appendChild(lab);
  LOG={rows:[],cols:e.cols,clock:cfg.clock||{start:'00:00:00',rate:1}};
  for(var i=0;i<rows;i++){ var r=document.createElement('div'); r.className='lgrow'; r.style.left=(x+(e.padLeft==null?20:e.padLeft))+'px'; r.style.top=(y+(e.padTop==null?8:e.padTop)+i*LH)+'px'; r.style.height=LH+'px'; r.style.width=(w-30)+'px'; ST.appendChild(r);
   var cells=e.cols.map(function(c){var s=document.createElement('span'); s.style.left=c.x+'px'; s.style.height=LH+'px'; s.setAttribute('data-t','text'); r.appendChild(s); return s});
   LOG.rows.push({el:r,cells:cells,last:null}); }
 }
};
var TA=[], LOG=null, BOXES=[], PATHS=[], TH={};
function clockStr(t){var p=LOG.clock.start.split(':').map(Number), s=Math.floor(p[0]*3600+p[1]*60+p[2]+t*LOG.clock.rate); s=mod(s,86400); var z=function(n){return (n<10?'0':'')+n}; return z(Math.floor(s/3600))+':'+z(Math.floor(s/60)%60)+':'+z(s%60)}
function renderLog(t){
  if(!LOG) return;
  var last=-1; for(var i=0;i<EVT.length;i++){ if(EVT[i].t<=t) last=i; else break; }
  var n=LOG.rows.length;
  LOG.rows.forEach(function(R,i){ var ev=EVT[last-(n-1)+i], isNew=(i===n-1), key=ev?(ev.t+'|'+ev.m+'|'+isNew):'';
    if(key===R.last) return; R.last=key;
    LOG.cols.forEach(function(c,ci){ var s=R.cells[ci], txt='', col='dim', bold=false, op=1;
      if(ev){ if(c.key==='time') txt=clockStr(ev.t);
        else if(c.key==='who'){ txt=ev.who; col=ev.c; bold=true; op=isNew?1:.8; }
        else if(c.key==='m'){ txt=ev.m; if(isNew){col='fg';bold=true} }
        else if(c.key==='g'){ txt=ev.g; if(isNew){col='fg';bold=true} } }
      s.textContent=txt; s.style.color=cc(col); s.style.fontWeight=bold?700:400; s.style.opacity=op; });
  });
}

function styleBoxes(){ BOXES.forEach(function(B_){ var e=B_.e, on=cond(e.when), th=on?e.then:{}, k=on?'1':'0'; if(k===B_.last) return; B_.last=k;
  var el=B_.el; el.style.background=cc(th.fill||e.fill)||''; el.style.color=cc(th.color||e.color||'fg');
  el.style.setProperty('--bw',(th.border!=null?th.border:(e.border!=null?e.border:(TH.borderWidth||2)))+'px');
  el.style.boxShadow=th.glow?'0 0 0 4px color-mix(in srgb, '+cc(th.glow)+' 30%, transparent), 0 0 16px color-mix(in srgb, '+cc(th.glow)+' 55%, transparent)':''; }); }
function stylePaths(){ PATHS.forEach(function(P){ var e=P.e, on=e.when&&cond(e.when), th=on?e.then:{}, k=on?'1':'0'; if(k===P.last) return; P.last=k;
  var col=cc(th.color||e.color||'line'), w=th.width||e.width||TH.wireWidth||2;
  P.pa.setAttribute('stroke',col); P.pa.setAttribute('stroke-width',w); P.pa.style.opacity=th.opacity!=null?th.opacity:(e.opacity!=null?e.opacity:1);
  if(P.hd){ P.hd.setAttribute('fill',col); P.hd.setAttribute('points',P.headPts); P.hd.style.opacity=P.pa.style.opacity; } }); }

// ---------- the one entry point ----------
window.seek=function(t){
  if(!window.__ready){ window.__pending=t; return; }
  try{
    V.__t=t;
    MACH.forEach(function(m){m.vars(t)});
    // packets on the main flow; count deliveries so "the number on the graph" is the number of packets that arrived
    var sig=0;
    PK.forEach(function(P){ if(P.when&&!cond(P.when)){ P.el.forEach(function(q){q[0].style.display='none';q[1].style.display='none'}); return; } P.o.forEach(function(o,n){ var u=(t+PRE+o)/P.period, d=(u-Math.floor(u))*P.len; sig+=Math.floor(u); putPk(P.el[n][0],P,d); putPk(P.el[n][1],P,d-P.tail); }); });
    V.packets=fmtNum(sig,'comma');
    V.clock=LOG?clockStr(t):'';
    TA.forEach(function(A){ var on=V[A.m+'.active']===String(A.i);
      A.ln.style.borderColor=on?A.col:''; A.hd.style.color=on?A.col:'var(--c-dim)';
      if(on){ var ph=Number(V[A.m+'.phase']), u=ph/0.9, d=(u-Math.floor(u))*(A.P.len+10); putPk(A.P.el[0],A.P,d); putPk(A.P.el[1],A.P,d-12); }
      else { A.P.el[0].style.display='none'; A.P.el[1].style.display='none'; } });
    styleBoxes(); stylePaths(); applyDyn(); renderLog(t);
    window.__t=t;
  }catch(e){fail(e)}
};
window.render=window.seek;

// ---------- layout self-check (used by scripts/check_frames.py) ----------
// Machine state at the current t, as a plain snapshot (added by this repo; used by scripts/check_truth.py).
window.__vars=function(){return JSON.parse(JSON.stringify(V))};
window.__check=function(){
  var prob=[], items=[], boxes=[], sr=ST.getBoundingClientRect(), sc=sr.width/CW;
  function R(rc){return {l:(rc.left-sr.left)/sc,t:(rc.top-sr.top)/sc,r:(rc.right-sr.left)/sc,b:(rc.bottom-sr.top)/sc}}
  function contentRect(el){var g=document.createRange(); g.selectNodeContents(el); var rs=g.getClientRects(), o=null; for(var i=0;i<rs.length;i++){var q=rs[i]; if(q.width<0.5||q.height<0.5) continue; if(!o) o={left:q.left,top:q.top,right:q.right,bottom:q.bottom}; else {o.left=Math.min(o.left,q.left);o.top=Math.min(o.top,q.top);o.right=Math.max(o.right,q.right);o.bottom=Math.max(o.bottom,q.bottom)}} return o}
  var els=ST.querySelectorAll('[data-t]');
  for(var i=0;i<els.length;i++){ var el=els[i], k=el.getAttribute('data-t');
    if(k==='box'||k==='frame'){ boxes.push({el:el,r:R(el.getBoundingClientRect()),k:k}); continue; }
    if(el.getAttribute('data-nocheck')) continue;
    var cr=contentRect(el); if(!cr) continue; var rr=R(cr); rr.el=el; rr.txt=el.textContent.trim().slice(0,28);
    // a flex item holding a bar has no text range; use its box
    items.push(rr); }
  function ov(a,b){return Math.min(a.r,b.r)-Math.max(a.l,b.l)>1.5&&Math.min(a.b,b.b)-Math.max(a.t,b.t)>1.5}
  // 1 text inside canvas
  items.forEach(function(a){ if(a.l<-0.5||a.t<-0.5||a.r>CW+0.5||a.b>CH+0.5) prob.push('outside canvas: "'+a.txt+'"'); });
  // 2 text inside its own box
  items.forEach(function(a){ var bx=boxes.filter(function(b){return b.el.contains(a.el)})[0];
    if(bx){ var r=bx.r; if(a.l<r.l+1||a.r>r.r-1||a.t<r.t-1||a.b>r.b+1) prob.push('text overflows its box: "'+a.txt+'" ['+Math.round(a.l)+'-'+Math.round(a.r)+'] box ['+Math.round(r.l)+'-'+Math.round(r.r)+']'); } });
  // 3 text vs text
  for(var x=0;x<items.length;x++)for(var y=x+1;y<items.length;y++){ var a=items[x],b=items[y]; if(a.el.contains(b.el)||b.el.contains(a.el)) continue; if(ov(a,b)) prob.push('text overlap: "'+a.txt+'" x "'+b.txt+'"'); }
  // 4 text vs foreign boxes, box vs box
  items.forEach(function(a){ boxes.forEach(function(b){ if(b.k==='frame') return; if(b.el.contains(a.el)||a.el.getAttribute('data-in')) return; if(ov(a,b.r)) prob.push('text over a box: "'+a.txt+'"'); }); });
  for(var p=0;p<boxes.length;p++)for(var q=p+1;q<boxes.length;q++){ if(boxes[p].k==='frame'||boxes[q].k==='frame') continue; if(ov(boxes[p].r,boxes[q].r)) prob.push('box overlap: #'+p+' x #'+q); }
  return prob;
};

// ---------- boot ----------
function fit(){ var s=Math.min(innerWidth/CW,innerHeight/CH); ST.style.transform='scale('+s+')'; ST.style.left=((innerWidth-CW*s)/2)+'px'; ST.style.top=((innerHeight-CH*s)/2)+'px'; }
var CANVAS_PRESETS={'4:5':[1200,1500],'3:4':[1080,1440],'1:1':[1080,1080]};
var THEME_PRESETS={
 'terminal-dark':{font:'"JetBrains Mono","IBM Plex Mono","DejaVu Sans Mono","Noto Sans Mono CJK SC",monospace',fontSize:21,lineHeight:30,boxMode:'segmented',
   colors:{bg:'#14171c',bar:'#262a32',line:'#4a5367',line2:'#3a4154',dim:'#6f788c',fg:'#e4e8f0',wh:'#ffffff',cy:'#86e1e6',bl:'#8fb4f6',gr:'#7fdba8',pu:'#b9a2f2',ye:'#e3c07a',hl:'#302d45',dots:'#566078'}},
 'light-pastel':{font:'"Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif',fontSize:17,lineHeight:24,boxMode:'solid',radius:9,borderWidth:1.5,wireWidth:2.2,glow:true,packetSize:10,
   colors:{bg:'#fcfcfb',bar:'#f1f1ef',line:'#2d3138',line2:'#c9ccd1',dim:'#7b828c',fg:'#23272e',wh:'#ffffff',ink:'#111111',
     gn:'#6fb34f',gnf:'#e7f4de',bl:'#5f93e0',blf:'#e4eefc',blt:'#3a6fc8',yl:'#e3b93d',ylf:'#fff5d6',or:'#e79a4c',orf:'#fdeedc',ort:'#d9731a',
     rd:'#e47b7b',rdf:'#fde7e7',rdt:'#d24a4a',pu:'#b389d9',puf:'#f2eafa',put:'#7d4fb0',mc:'#9a92d9',mcf:'#eeebfa',tl:'#5fbdb2',tlf:'#e0f4f1',
     gy:'#b9bdc4',gyf:'#f5f5f4',pk:'#f0575f',lit:'#fff1b8'}}
};
function mergeTheme(u){ var base=THEME_PRESETS[u.preset||'terminal-dark']||THEME_PRESETS['terminal-dark'], o=Object.assign({},base,u); o.colors=Object.assign({},base.colors,u.colors||{}); return o; }
function boot(c){
  cfg=c; var cv=Object.assign({},c.canvas||{}), th=mergeTheme(c.theme||{}); TH=th;
  if(cv.preset&&CANVAS_PRESETS[cv.preset]){ cv.width=cv.width||CANVAS_PRESETS[cv.preset][0]; cv.height=cv.height||CANVAS_PRESETS[cv.preset][1]; }
  CW=cv.width||1200; CH=cv.height||1500; PRE=cv.preroll||0; FS=th.fontSize||21; LH=th.lineHeight||30;
  document.title=(c.meta&&c.meta.title)||'live-panel'; if(c.meta&&c.meta.lang) document.documentElement.lang=c.meta.lang;
  var root=document.documentElement.style, cols=th.colors||{};
  Object.keys(cols).forEach(function(k){root.setProperty('--c-'+k,cols[k])});
  root.setProperty('--font',th.font||'monospace'); root.setProperty('--radius',(th.radius||0)+'px'); root.setProperty('--bw',(th.borderWidth||2)+'px'); root.setProperty('--fs',FS+'px'); root.setProperty('--lh',LH+'px');
  ST.style.width=CW+'px'; ST.style.height=CH+'px'; ST.style.background='var(--c-bg)';
  // machines
  var M=c.machines||{}; Object.keys(M).forEach(function(id){ var m=M[id]; var f=MK[m.type]; if(!f) throw new Error('unknown machine type '+m.type); MACH.push(f(id,m)); });
  var lo=-120, hi=(cv.duration||60)+120; MACH.forEach(function(m){ EVT=EVT.concat(m.events(lo,hi)) });
  // stable sort by time (ties keep config order)
  EVT=EVT.map(function(e,i){e.__i=i;return e}).sort(function(a,b){return a.t-b.t||a.__i-b.__i});
  // titlebar
  if(c.titlebar){ var tb=c.titlebar, h=tb.height||38, d=document.createElement('div'); d.className='tb'; d.style.width=CW+'px'; d.style.height=h+'px'; d.style.lineHeight=h+'px'; d.style.fontSize=(tb.size||14)+'px';
    [['#f2645a',20],['#f1bd3c',42],['#55c552',64]].forEach(function(o){var i=document.createElement('i'); i.style.left=(o[1]-7)+'px'; i.style.top=(h/2-7)+'px'; i.style.width='14px'; i.style.height='14px'; i.style.background=o[0]; d.appendChild(i)});
    d.appendChild(document.createTextNode(tb.text||'')); ST.appendChild(d); }
  (c.elements||[]).forEach(function(e){ var f=B[e.type]; if(!f) throw new Error('unknown element type '+e.type); f(e); });
  if(c.credit){ B.text(Object.assign({type:'text',x:0,w:CW,align:'center',y:CH-14,size:12,c:'dim'},c.credit)); }
  fit(); addEventListener('resize',fit);
  var go=function(){ window.__ready=true; window.seek(window.__pending==null?0:window.__pending);
    if(!/[?&]manual/.test(location.search)){ var t0=performance.now(), D=cv.duration||30; (function loop(now){ window.seek(((now-t0)/1000)%D); requestAnimationFrame(loop); })(t0); } };
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(go);
}
loadConfig().then(boot).catch(fail);
})();
