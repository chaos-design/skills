name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # 任何 skill 的增删或改动都会改变排行榜数据，必须连带重建站点。
      - "skills/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "skills/**"
      - ".github/workflows/site.yml"
  # 数据自动保鲜：定时重新生成 public/data/skills.json 并重新部署，
  # 前端每次访问都会 revalidate，因此无需人工提交数据。
  schedule:
    - cron: "0 */6 * * *"

# site/ 是独立站点：CI 只校验与构建站点本身，部署拆成 Pages（静态导出）
# 与 Vercel（项目根目录指向 site/）两条互不影响的路径。
permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # 数据永远是生成的，不是手写的：先按仓库当前状态重新生成，再跑测试与
      # 构建。提交版本留一份副本，供 PR 的漂移检查比对。
      - name: Regenerate skill data
        # sync:skills 走 GitHub REST API 统计提交；带 token 可把限流从
        # 60 次/小时提上去。PR 上拿不到 secrets，退回匿名额度也够用。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -R public/data /tmp/committed-data
          npm run sync:skills

      - run: npm test

      # 生成数据必须是仓库状态的纯函数。PR 上要求提交内容与仓库一致（除
      # generatedAt 时间戳外不允许漂移）；push/schedule 时不作此约束——那两
      # 种情况下本来就该用刚生成的最新数据构建，而不是报错。
      - name: Skill data is in sync
        if: github.event_name == 'pull_request'
        run: |
          strip='grep -v "\"generatedAt\""'
          if ! diff -q <(eval $strip /tmp/committed-data/skills.json) <(eval $strip public/data/skills.json) >/dev/null; then
            echo "::error file=public/data/skills.json::stale skill data — run 'npm run sync:skills' in site/ and commit the result"
            diff <(eval $strip /tmp/committed-data/skills.json) <(eval $strip public/data/skills.json) || true
            exit 1
          fi
          # 发布的 README 副本（public/data/skills/）同样必须是源文档的纯函数。
          if ! diff -r /tmp/committed-data/skills public/data/skills >/dev/null; then
            echo "::error file=public/data/skills::stale readme copies — run 'npm run sync:skills' in site/ and commit the result"
            diff -r /tmp/committed-data/skills public/data/skills || true
            exit 1
          fi
          echo "skill data in sync"

      # GitHub Pages 项目页挂在 /<repo> 下；Vercel 从仓库直接构建，不带 basePath。
      - name: Build static export
        run: npm run build
        env:
          BASE_PATH: ${{ github.ref == 'refs/heads/main' && '/skills' || '' }}

      # 导出产物必须自包含：脚本与样式表不允许引用外部 CDN。
      # 注意 bash -e：grep 无匹配时退出码为 1，「没有外链」这一成功情形
      # 会让裸 grep 赋值直接失败，因此必须 || true 兜底。
      - name: Verify static export
        run: |
          test -f out/index.html
          scripts=$(grep -oE '<script[^>]*src="https?://[^"]*"' out/index.html || true)
          styles=$(grep -oE '<link[^>]*href="https?://[^"]*\.css[^"]*"' out/index.html || true)
          external="$scripts$styles"
          if [ -n "$external" ]; then
            echo "::error::static export references external assets: $external"
            exit 1
          fi
          echo "static export ok: $(find out -name '*.html' | wc -l | tr -d ' ') html files"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: site-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 首次部署时自动开通 Pages（build_type=workflow），无需手动在
      # Settings → Pages 里选择 "GitHub Actions" 源；已启用时仅查询元数据。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
