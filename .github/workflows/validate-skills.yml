name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

# 每个 skill 的校验是独立的。新增带可运行检查脚本的 skill 时在这里追加一个 job 即可。
jobs:
  live-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # ubuntu-latest 预装 google-chrome 和 ffmpeg，无需额外安装。
      # HTML 页与视频校验都要真实跑起来一个浏览器和 ffmpeg 管道。
      - name: Compile scripts
        run: python3 -m py_compile skills/live-panel/scripts/*.py

      - name: Config is well-formed and builds a self-contained page
        working-directory: skills/live-panel
        run: |
          python3 scripts/build_page.py examples/skills-pipeline/config.json --print
          python3 scripts/build_page.py examples/skills-pipeline/config.json --out /tmp/panel.html
          ! grep -qE 'https?://[^"'"'"' ]*\.(js|css|woff|png)' /tmp/panel.html

      - name: Layout and replay determinism
        working-directory: skills/live-panel
        run: python3 scripts/check_frames.py --config examples/skills-pipeline/config.json --out-dir /tmp/lp-frames --samples 40 --png 3 --repeat

      - name: Log agrees with the panel (no stale second truth)
        working-directory: skills/live-panel
        run: python3 scripts/check_truth.py --config examples/skills-pipeline/config.json --samples 40

      - name: mp4 renders end to end
        working-directory: skills/live-panel
        run: |
          python3 scripts/render.py --config examples/skills-pipeline/config.json --out /tmp/panel.mp4 --duration 3
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/panel.mp4

  html-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Compile scripts
        run: python3 -m py_compile skills/html-brief/scripts/*.py skills/html-brief/scripts/briefkit/*.py

      - name: Semantic check against drafts
        working-directory: skills/html-brief
        run: python3 scripts/check_semantics.py

      - name: Validate example renders
        working-directory: skills/html-brief
        run: python3 scripts/html_brief.py validate --out-dir /tmp/hb-out

      - name: Layout check in headless Chrome
        working-directory: skills/html-brief
        run: python3 scripts/check_layout.py

  plan-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Compile scripts
        run: python3 -m py_compile skills/plan-flow/scripts/*.py

      - name: Archive gate refuses an unfinished plan
        run: |
          root=$(mktemp -d)
          touch "$root/README.md"
          pf="python3 skills/plan-flow/scripts/plan_flow.py --root $root"
          $pf new "Gate check" --task "one task"
          if $pf move 01 archive; then echo "archive must be refused while items are open"; exit 1; fi
          $pf tick 01 1 2 3 4 5 6
          if $pf move 01 archive; then echo "archive must be refused while placeholders remain"; exit 1; fi
          $pf status

  task-inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Compile scripts
        run: python3 -m py_compile skills/task-inject/scripts/*.py

      - name: Halt gate and drain gate on a real flow
        run: |
          export TASK_INJECT_ROOT=$(mktemp -d)
          ti="python3 skills/task-inject/scripts/task_inject.py"
          $ti init
          $ti inject "switch to pnpm" --action note
          $ti inject "wrong direction, do CLI" --action redirect --sender reviewer
          $ti inject "stop before the migration" --action halt
          # severity order: halt first
          $ti check | head -1 | grep -q '^003 \[halt\]' || { echo "halt must sort first"; exit 1; }
          # strict gate: pending inbox exits non-zero
          if $ti check --strict >/dev/null 2>&1; then echo "strict must fail while pending"; exit 1; fi
          # halt cannot be acknowledged without evidence
          if $ti apply 003 >/dev/null 2>&1; then echo "halt requires --note"; exit 1; fi
          $ti apply 003 --note "stopped before migration; schema review done"
          $ti apply 001 --note "switched to pnpm"
          $ti apply 002 --note "re-scoped to CLI"
          # drained inbox passes strict
          $ti check --strict
          # ids are never reused after the inbox drains
          out=$($ti inject "one more" --action note)
          case "$out" in *004*) ;; *) echo "id must continue at 004, got: $out"; exit 1;; esac
          $ti log --last 4

  change-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Compile scripts
        run: python3 -m py_compile skills/change-intake/scripts/*.py

      - name: Probe falls back to local without a GitHub remote
        run: |
          root=$(mktemp -d)
          git init -q "$root"
          out=$(python3 skills/change-intake/scripts/change_intake.py probe --cwd "$root" --json)
          echo "$out" | grep -q '"mode": "local"'
          echo "$out" | grep -q 'origin is not a GitHub repository'

      - name: Routing policy rejects every missing capability
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("ci", "skills/change-intake/scripts/change_intake.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          for remote, want in [
              ("git@github.com:a/b.git", "a/b"),
              ("https://github.com/a/b.git", "a/b"),
              ("ssh://git@github.com/a/b", "a/b"),
              ("https://gitlab.com/a/b.git", ""),
          ]:
              assert m.parse_github_remote(remote) == want, remote
          checks = {"github_url": True, "gh_cli": True, "gh_auth": True,
                    "repo_slug": "a/b", "issue_write": True}
          assert m.decide(checks)[0] == "github"
          for key in checks:
              broken = dict(checks)
              broken[key] = False
              assert m.decide(broken)[0] == "local", key
          print("routing policy ok")
          PY

      - name: Route, bind and gate a real flow
        run: |
          root=$(mktemp -d)
          S=skills/change-intake/scripts/change_intake.py
          python3 $S init --root "$root"
          python3 $S new "Add SSO login" --kind feature --goal "Users can sign in" \
            --task "Add callback endpoint" --task "Verify id tokens" --mode local --root "$root"
          if python3 $S check --strict --root "$root"; then echo "unbound record must fail strict"; exit 1; fi
          python3 $S bind 001 --plan 07 --root "$root"
          python3 $S check --strict --root "$root"
          python3 $S new "Fix pagination" --kind fix --goal "Page 2 is correct" \
            --task "Correct offset" --mode github --repo chaos-design/skills --root "$root"
          if python3 $S bind 002 --plan 08 --root "$root"; then echo "mode mismatch must fail"; exit 1; fi
          python3 $S bind 002 --main 42 --child 43 --root "$root"
          python3 $S check --strict --root "$root"
          python3 $S status --root "$root"
          python3 $S show 002 --root "$root"
          if python3 $S new "Add SSO login" --kind feature --task x --mode local --root "$root"; then
            echo "duplicate title must fail"; exit 1
          fi

      - name: Local mode bootstraps the plan-flow contract
        run: |
          root=$(mktemp -d)
          mkdir -p "$root/changes"
          echo '# changes' > "$root/changes/README.md"
          S=skills/change-intake/scripts/change_intake.py
          python3 $S new "Fix login" --kind fix --goal "Login works" \
            --task "Correct redirect" --mode local --root "$root"
          test -f "$root/plans/README.md"
          grep -q 'planing' "$root/plans/README.md"
          grep -q 'unit_test_result' "$root/plans/README.md"
          # The generated root is usable by plan-flow itself.
          python3 skills/plan-flow/scripts/plan_flow.py --root "$root/plans" \
            new "Fix login" --goal "Login works" --task "Correct redirect"
          # An existing contract is never overwritten.
          echo '# custom' >> "$root/plans/README.md"
          python3 $S init-plans --root "$root"
          grep -q '# custom' "$root/plans/README.md"
          python3 $S bind 001 --plan 01 --root "$root"
          python3 $S check --strict --root "$root"

      - name: Security gates and edge cases
        run: |
          python3 - <<'PY'
          import contextlib, importlib.util, io, pathlib, tempfile
          spec = importlib.util.spec_from_file_location("ci", "skills/change-intake/scripts/change_intake.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          # credentials in an HTTPS remote never reach logs
          remote = "https://user:secret-token@github.com/a/b.git"
          assert "<redacted>" in m.sanitize_remote(remote)
          assert "secret-token" not in m.sanitize_remote(remote)
          root = pathlib.Path(tempfile.mkdtemp())
          changes = root / "changes"
          changes.mkdir()
          (changes / "README.md").write_text("# c\n", encoding="utf-8")
          common = dict(root=str(root), cwd=None, mode="github", repo="a/b",
                        kind="fix", goal="g", slug=None)
          def new(title, tasks, **kw):
              m.cmd_new(type("A", (), {**common, "title": title, "task": tasks, **kw})())
          try:
              new("Bad", ["t"], slug="../escape")
          except m.IntakeError:
              pass
          else:
              raise AssertionError("slug path traversal accepted")
          assert not (changes / "001-..").exists()
          try:
              new("Bad\nplan: 99", ["t"])
          except m.IntakeError:
              pass
          else:
              raise AssertionError("newline in title accepted")
          # dry-run must not write the record or call gh
          new("Safe", ["t1", "t2"], slug="safe")
          rec = m.resolve(changes, "001")
          before = rec.path.read_text(encoding="utf-8")
          def explode(args):
              raise AssertionError("gh called during dry-run")
          m.publish_record(rec, gh=explode, dry_run=True)
          assert rec.path.read_text(encoding="utf-8") == before
          # an interrupted run resumes: one main, missing children only
          new("Resume", ["a", "b"], slug="resume")
          calls, counter = [], {"n": 10}
          def fake(args):
              calls.append(list(args))
              if args[:2] == ["label", "list"]:
                  return "rfc,task-pool,change-intake,fix"
              if args[:2] == ["issue", "create"]:
                  counter["n"] += 1
                  return f"https://github.com/a/b/issues/{counter['n']}"
              if args[:2] == ["api", "graphql"]:
                  return "11"
              if args[0] == "api" and "--jq" in args:
                  return "NODE_1"
              return ""
          result = m.publish_record(m.resolve(changes, "002"), gh=fake)
          assert result["main"] == "11" and result["children"] == ["12", "13"], result
          partial = m.resolve(changes, "002")
          partial.set_meta("children", "12")
          partial.save()
          previous = len([a for a in calls if a[:2] == ["issue", "create"]])
          resumed = m.publish_record(m.resolve(changes, "002"), gh=fake)
          # the record is the source of truth: task "a" is not duplicated and
          # only the missing task gets a new child (#14)
          assert resumed["main"] == "11" and resumed["children"] == ["12", "14"], resumed
          assert len([a for a in calls if a[:2] == ["issue", "create"]]) == previous + 1
          # failed native links keep the checklist and warn honestly
          new("Fallback", ["a"], slug="fallback")
          def broken(args):
              if args[:2] == ["label", "list"]:
                  return "rfc,task-pool,change-intake,fix"
              if args[:2] == ["issue", "create"]:
                  return "https://github.com/a/b/issues/20"
              if args[:2] == ["api", "graphql"] or "-X" in args:
                  raise m.IntakeError("api down")
              if args[0] == "api" and "--jq" in args:
                  return "NODE_1"
              return ""
          warn = io.StringIO()
          with contextlib.redirect_stdout(warn):
              fallback = m.publish_record(m.resolve(changes, "003"), gh=broken)
          assert fallback["children"] == ["20"], fallback
          assert "warning: native sub-issue link failed" in warn.getvalue()
          # ambiguous refs and cross-mode bindings are refused
          new("Alpha one", ["a"], slug="alpha-one")
          new("Alpha two", ["a"], slug="alpha-two")
          try:
              m.resolve(changes, "alpha")
          except m.IntakeError:
              pass
          else:
              raise AssertionError("ambiguous ref accepted")
          m.cmd_new(type("A", (), {"root": str(root), "cwd": None, "mode": "local",
                                   "repo": "-", "kind": "fix", "title": "Local x",
                                   "goal": "g", "task": ["t"], "slug": "local-x"})())
          wrong = m.resolve(changes, "006")
          wrong.set_meta("main", "99")
          wrong.save()
          report = io.StringIO()
          with contextlib.redirect_stdout(report):
              try:
                  m.cmd_check(type("A", (), {"root": str(root), "strict": True})())
              except SystemExit:
                  pass
          assert "006: local record has issue bindings" in report.getvalue()
          # publishing must never target a repo other than the current origin
          original_probe = m.probe
          m.probe = lambda: {"mode": "github", "repo": "other/repo",
                             "reason": "x", "checks": {}}
          try:
              m.cmd_publish(type("A", (), {"root": str(root), "ref": "002",
                                           "dry_run": True})())
          except m.IntakeError:
              pass
          else:
              raise AssertionError("publish to the wrong repo accepted")
          finally:
              m.probe = original_probe
          print("security gates and edge cases: ok")
          PY

      - name: Publish creates issues and binds real numbers
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, tempfile
          spec = importlib.util.spec_from_file_location("ci", "skills/change-intake/scripts/change_intake.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          root = pathlib.Path(tempfile.mkdtemp())
          (root / "changes").mkdir()
          (root / "changes/README.md").write_text("# changes\n", encoding="utf-8")
          m.cmd_new(type("A", (), {
              "root": str(root), "cwd": None, "mode": "github", "repo": "a/b",
              "kind": "feature", "title": "Add SSO login", "goal": "Users can sign in",
              "task": ["Add callback", "Verify tokens"], "slug": None,
          })())
          rec = m.resolve(root / "changes", "001")
          calls, counter = [], {"n": 10}
          def fake(args):
              calls.append(list(args))
              if args[:2] == ["label", "list"]:
                  return ""
              if args[:2] == ["issue", "create"]:
                  counter["n"] += 1
                  return f"https://github.com/a/b/issues/{counter['n']}"
              if args[:2] == ["api", "graphql"]:
                  return "11"
              if args[0] == "api" and "--jq" in args:
                  return "NODE_1"
              return ""
          result = m.publish_record(rec, gh=fake)
          assert result["main"] == "11" and result["children"] == ["12", "13"], result
          titles = [a[a.index("--title") + 1] for a in calls if a[:2] == ["issue", "create"]]
          assert titles[0] == "RFC: Add SSO login", titles
          links = [a for a in calls if a[:2] == ["api", "graphql"]]
          assert len(links) == 2, links
          assert all(any(arg.startswith("subIssueId=") for arg in a) for a in links), links
          saved = m.resolve(root / "changes", "001").meta()
          assert saved["main"] == "11" and saved["children"] == "12, 13", saved
          # re-run is idempotent: no duplicate issues
          bodies = [a[a.index("--body") + 1] for a in calls if a[:2] == ["issue", "edit"]]
          assert "- [ ] #12 " in bodies[-1] and "- [ ] #13 " in bodies[-1], bodies[-1]
          before = len([a for a in calls if a[:2] == ["issue", "create"]])
          m.publish_record(m.resolve(root / "changes", "001"), gh=fake)
          assert before == len([a for a in calls if a[:2] == ["issue", "create"]])
          print("publish flow: ok")
          PY

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every manifest is well-formed JSON with the expected keys
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          need = {"name", "version", "category", "description", "homepage", "compat"}
          bad = 0
          for m in sorted(pathlib.Path("skills").glob("*/manifest.json")):
              d = json.loads(m.read_text(encoding="utf-8"))
              missing = need - set(d)
              if missing:
                  print(f"{m}: missing {sorted(missing)}"); bad += 1
              else:
                  print(f"ok {m}: {d['name']} {d['version']}")
          sys.exit(1 if bad else 0)
          PY

      - name: Live-panel preview is self-contained
        run: |
          page=tests/live-panel/skills-pipeline/index.html
          if grep -qE '<script[^>]*src="https?:' "$page" || grep -qE '<link[^>]*href="https?:' "$page"; then
            echo "live-panel page must be self-contained"; exit 1
          fi
          echo "live-panel page self-contained"

      - name: Every preview link in tests/index.html resolves
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("tests")
          page = root / "index.html"
          bad = 0
          for m in re.finditer(r'href="((?!https?:)[^"#]+)"', page.read_text(encoding="utf-8")):
              if not (root / m.group(1)).exists():
                  print("broken link:", m.group(1)); bad += 1
          print(f"{'ok' if not bad else 'broken:'} {len(re.findall(r'href=', page.read_text(encoding='utf-8')))} links")
          sys.exit(1 if bad else 0)
          PY
