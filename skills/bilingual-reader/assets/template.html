<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__PAGE_TITLE__</title>
    <style>
      /* 颜色 / 字体 / 圆角全部走 CSS 变量；具体取值由 THEME 在运行时注入，
     因此暗/亮主题切换只是换一套变量，无需改动结构。 */
      :root {
        --bg: #0e1116;
        --panel: #161b22;
        --panel2: #1c232d;
        --border: #2a3340;
        --text: #e6edf3;
        --muted: #9aa7b4;
        --en: #cdd9e5;
        --zh: #e8d9b8;
        --accent: #f5a623;
        --accent2: #58a6ff;
        --green: #3fb950;
        --tip-bg: #0b1622;
        --hl: rgba(245, 166, 35, 0.16);
        --hl-line: rgba(245, 166, 35, 0.55);
        --accent-ink: #1a1205;
        --accent2-ink: #031018;
        --accent-shadow: rgba(245, 166, 35, 0.35);
        --radius: 14px;
        --radius-lg: 16px;
        --radius-sm: 9px;
        --font:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
        --hero-angle: 135deg;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        line-height: 1.7;
        transition:
          background 0.3s,
          color 0.3s;
      }
      #progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        width: 0;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        z-index: 1000;
        transition: width 0.1s;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 900;
        backdrop-filter: blur(10px);
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        border-bottom: 1px solid var(--border);
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 17px;
        margin: 0;
        flex: 1;
        min-width: 200px;
        font-weight: 700;
      }
      header h1 span {
        color: var(--accent);
      }
      .ctrls {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        align-items: center;
      }
      .group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .group-lab {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 1px;
      }
      .seg {
        display: inline-flex;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 3px;
        gap: 2px;
      }
      .seg-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        color: var(--muted);
        border: none;
        cursor: pointer;
        padding: 6px 14px;
        border-radius: 7px;
        font-size: 13px;
        transition: 0.2s;
        white-space: nowrap;
      }
      .seg-btn .ico {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }
      .seg-btn:hover {
        color: var(--accent);
      }
      .seg-btn.active {
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        box-shadow: 0 2px 8px var(--accent-shadow);
      }
      .btn {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 13px;
        transition: 0.2s;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn.active {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
        font-weight: 600;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 24px 80px;
      }
      .hero {
        background: linear-gradient(var(--hero-angle), var(--panel), var(--panel2));
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 30px;
        margin-bottom: 26px;
      }
      .hero h2 {
        margin: 0 0 6px;
        font-size: 26px;
      }
      .hero .meta {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 14px;
      }
      .hero p {
        color: var(--en);
        margin: 6px 0;
      }
      .hero .zh {
        color: var(--zh);
      }
      section {
        margin-bottom: 30px;
      }
      .sec-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        margin: 0 0 16px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--border);
      }
      .sec-title .num {
        background: var(--accent);
        color: var(--accent-ink);
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-size: 14px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: visible;
        margin-bottom: 14px;
        background: var(--panel);
        transition: 0.2s;
        position: relative;
      }
      .row:hover {
        border-color: var(--accent2);
        z-index: 2;
      }
      .cell {
        padding: 16px 20px;
      }
      .cell.en {
        border-right: 1px solid var(--border);
        color: var(--en);
        font-size: 15px;
        border-radius: var(--radius) 0 0 var(--radius);
      }
      .cell.zh {
        color: var(--zh);
        font-size: 15px;
        background: var(--panel2);
        border-radius: 0 var(--radius) var(--radius) 0;
      }
      .cell .lab {
        display: none;
      }
      /* Refactored content modules: sections 1-5 and 8 use a richer article card
     layout, while the interactive cards and quiz modules keep their original
     markup and behavior. */
      .refactored-row {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(260px, 0.95fr);
        gap: 14px;
        margin: 18px 0;
        padding: 16px;
        border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--border));
        border-radius: calc(var(--radius-lg) + 8px);
        background:
          linear-gradient(
            135deg,
            color-mix(in srgb, var(--accent) 12%, transparent),
            transparent 34%
          ),
          linear-gradient(180deg, color-mix(in srgb, var(--panel) 86%, transparent), var(--panel2));
        box-shadow: 0 18px 46px rgba(0, 0, 0, 0.18);
        overflow: visible;
        transition:
          transform 0.25s,
          border-color 0.25s,
          box-shadow 0.25s;
      }
      .refactored-row::before {
        content: attr(data-row);
        position: absolute;
        left: 16px;
        top: -12px;
        min-width: 34px;
        height: 24px;
        padding: 0 9px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.08em;
        box-shadow: 0 10px 24px var(--accent-shadow);
      }
      .refactored-row:hover {
        transform: translateY(-3px);
        border-color: var(--accent2);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.26);
      }
      .refactored-cell {
        position: relative;
        min-width: 0;
        padding: 22px 22px 20px;
        border-radius: calc(var(--radius) + 6px);
        border: 1px solid color-mix(in srgb, var(--border) 82%, transparent);
        overflow: visible;
      }
      .refactored-cell::before {
        display: block;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .refactored-cell.en {
        color: var(--en);
        background:
          radial-gradient(
            circle at 0 0,
            color-mix(in srgb, var(--accent2) 13%, transparent),
            transparent 36%
          ),
          color-mix(in srgb, var(--panel) 88%, transparent);
      }
      .refactored-cell.en::before {
        content: 'Original';
      }
      .refactored-cell.zh {
        color: var(--zh);
        background:
          radial-gradient(
            circle at 100% 0,
            color-mix(in srgb, var(--accent) 16%, transparent),
            transparent 36%
          ),
          color-mix(in srgb, var(--panel2) 92%, transparent);
      }
      .refactored-cell.zh::before {
        content: '译读';
      }
      .refactored-row .w {
        z-index: 5;
      }
      .finale-box {
        position: relative;
        padding: 28px;
        margin-top: 10px;
        border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
        border-radius: calc(var(--radius-lg) + 10px);
        background:
          radial-gradient(
            circle at 14% 10%,
            color-mix(in srgb, var(--accent) 20%, transparent),
            transparent 34%
          ),
          radial-gradient(
            circle at 90% 0,
            color-mix(in srgb, var(--accent2) 18%, transparent),
            transparent 30%
          ),
          linear-gradient(145deg, var(--panel), var(--panel2));
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.26);
        overflow: hidden;
      }
      .finale-box::after {
        content: '';
        position: absolute;
        inset: auto 24px 20px 24px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
        opacity: 0.72;
      }
      .finale-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .finale-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 900;
        box-shadow: 0 14px 30px var(--accent-shadow);
      }
      .finale-head h3 {
        margin: 0;
        color: var(--text);
        font-size: 20px;
      }
      .finale-quote {
        margin: 12px 0;
        padding: 14px 16px;
        border-left: 4px solid var(--accent);
        border-radius: 0 var(--radius) var(--radius) 0;
        background: color-mix(in srgb, var(--panel) 72%, transparent);
        color: var(--text);
        font-size: 16px;
        line-height: 1.65;
      }
      .finale-quote.zh {
        border-left-color: var(--accent2);
        color: var(--zh);
        font-style: normal;
      }
      .finale-intro {
        color: var(--en);
        margin: 16px 0 0;
      }
      #originalSection {
        display: none;
      }
      body.mode-original .summary-view {
        display: none;
      }
      body.mode-original #originalSection {
        display: block;
      }
      body.mode-original .toc {
        display: none;
      }
      body.gloss-open .hero,
      body.gloss-open .summary-view,
      body.gloss-open #originalSection {
        display: none !important;
      }
      body.gloss-open .toc {
        display: none;
      }
      .og-h {
        margin: 34px 0 14px;
        padding: 10px 16px;
        font-size: 17px;
        font-weight: 800;
        color: var(--accent);
        background: linear-gradient(90deg, var(--hl), transparent);
        border-left: 4px solid var(--accent);
        border-radius: 0 8px 8px 0;
        letter-spacing: 0.3px;
      }
      .og-h:first-child {
        margin-top: 6px;
      }
      .w {
        position: relative;
        z-index: 20;
        cursor: help;
        padding: 0 1px;
        color: color-mix(in srgb, var(--accent) 82%, var(--text));
        background: transparent !important;
        border-radius: 0;
        text-decoration-line: underline;
        text-decoration-style: double;
        text-decoration-color: var(--accent);
        text-decoration-thickness: 1.5px;
        text-underline-offset: 4px;
        transition:
          color 0.15s,
          text-decoration-color 0.15s;
      }
      .w::after {
        content: '';
        position: absolute;
        right: -5px;
        top: 0.05em;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--accent2);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent2) 22%, transparent);
      }
      .w:hover {
        z-index: 2147483647;
        color: var(--accent2);
        background: transparent !important;
        text-decoration-color: var(--accent2);
      }
      .tip {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateY(2px);
        width: 290px;
        background: var(--tip-bg);
        border: 1px solid var(--accent);
        border-radius: 12px;
        padding: 14px 16px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
        opacity: 0;
        visibility: hidden;
        filter: blur(8px);
        transition:
          opacity 0.16s,
          transform 0.16s,
          filter 0.16s;
        z-index: 2147483647;
        text-align: left;
        pointer-events: none;
      }
      /* tooltip 显示由 JS 控制 tip-open 类。tip 会被挂载到 <body> 顶层，
     彻底脱离可能带 transform/filter 的内容容器，保证定位精准且层级最高。
     不使用指向箭头；隐藏时通过 blur 淡出（滚动时即触发）。 */
      .tip.tip-open {
        opacity: 1;
        visibility: visible;
        filter: blur(0);
        transform: translateY(0);
        pointer-events: auto;
      }
      .tip .h {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .tip .word {
        font-size: 20px;
        font-weight: 800;
        color: var(--accent);
        line-height: 1.1;
      }
      .tip .sub {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .tip .ipa {
        color: var(--accent2);
        font-size: 13px;
        font-family: Georgia, serif;
        white-space: nowrap;
      }
      .tip .pos {
        font-size: 11px;
        background: color-mix(in srgb, var(--accent2) 92%, #000);
        color: #fff;
        padding: 1px 8px;
        border-radius: 6px;
        font-style: normal;
        font-weight: 800;
        white-space: nowrap;
      }
      html[data-theme="light"] .tip .pos {
        background: color-mix(in srgb, var(--accent2) 16%, #fff);
        color: #073763;
      }
      .lv {
        font-size: 10px;
        font-weight: 800;
        padding: 1px 7px;
        border-radius: 6px;
        letter-spacing: 0.5px;
        white-space: nowrap;
        color: #06121f;
      }
      .lv-b1 {
        background: #7ee0a6;
      }
      .lv-b2 {
        background: #5bc8e0;
      }
      .lv-c1 {
        background: #ffd66b;
      }
      .lv-c2 {
        background: #ff9e7a;
      }
      .lv-term {
        background: #c79bff;
        color: #fff;
      }
      .speak {
        margin-left: auto;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--accent2);
        color: var(--accent2-ink);
        border: none;
        cursor: pointer;
        font-size: 15px;
        display: grid;
        place-items: center;
        transition: 0.2s;
      }
      html[data-theme='light'] .toc {
        background: color-mix(in srgb, #fff 88%, transparent);
        border-color: color-mix(in srgb, var(--accent2) 24%, #d6e4f5);
        box-shadow:
          0 12px 28px rgba(31, 78, 121, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.78);
      }
      html[data-theme='light'] .toc a {
        background: color-mix(in srgb, var(--accent2) 22%, #cfd8e3);
      }
      html[data-theme='light'] .toc a:hover {
        background: var(--accent2);
        box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent2) 12%, transparent);
      }
      html[data-theme='light'] .toc a span {
        background: rgba(255, 255, 255, 0.96);
        border-color: color-mix(in srgb, var(--accent2) 26%, #d6e4f5);
        box-shadow: 0 10px 24px rgba(31, 78, 121, 0.12);
      }
      .speak:hover {
        transform: scale(1.12);
        box-shadow: 0 0 10px var(--accent2);
      }
      .speak:active {
        transform: scale(0.92);
      }
      .tip .def {
        color: var(--text);
        font-size: 14px;
        margin: 6px 0;
        line-height: 1.5;
      }
      .tip .eg {
        color: var(--en);
        font-size: 13px;
        border-left: 2px solid var(--accent);
        padding-left: 8px;
        margin-top: 6px;
        font-style: italic;
      }
      .tip .eg .egzh {
        display: block;
        color: var(--muted);
        font-style: normal;
        margin-top: 2px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 14px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        transition: 0.25s;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: var(--accent);
        transform: scaleY(0);
        transition: 0.25s;
        transform-origin: top;
      }
      .card:hover {
        transform: translateY(-4px);
        border-color: var(--accent);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .card:hover::before {
        transform: scaleY(1);
      }
      .card .ico {
        font-size: 24px;
        margin-bottom: 8px;
      }
      .card h4 {
        margin: 0 0 4px;
        font-size: 16px;
        color: var(--accent);
      }
      .card .zhname {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .card .body {
        font-size: 13px;
        color: var(--en);
        margin-top: 8px;
      }
      .card .when {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed var(--border);
        font-size: 12.5px;
        color: var(--zh);
      }
      .principles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
      }
      .pri {
        background: linear-gradient(var(--hero-angle), var(--panel), var(--panel2));
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        text-align: center;
        transition: 0.25s;
      }
      .pri:hover {
        transform: scale(1.03);
        border-color: var(--accent);
      }
      .pri .big {
        font-size: 32px;
        margin-bottom: 8px;
      }
      .pri h4 {
        margin: 0 0 6px;
        color: var(--accent);
        font-size: 16px;
      }
      .pri p {
        margin: 0;
        font-size: 13px;
        color: var(--en);
      }
      .summary-box {
        background: linear-gradient(var(--hero-angle), var(--panel), var(--panel2));
        border: 1px solid var(--accent);
        border-radius: var(--radius-lg);
        padding: 26px;
        margin-top: 8px;
      }
      .summary-box h3 {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 18px;
      }
      .summary-box .q {
        font-size: 16px;
        color: var(--text);
        font-style: italic;
        border-left: 3px solid var(--accent);
        padding-left: 14px;
        margin: 14px 0;
      }
      #glossary {
        display: none;
      }
      #glossary.show {
        display: block;
      }
      .gloss-grid {
        display: block;
      }
      .gloss-group {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 22px 0 12px;
        padding-bottom: 8px;
        border-bottom: 1px dashed var(--border);
      }
      .gloss-group:first-child {
        margin-top: 4px;
      }
      .gloss-group h4 {
        display: block;
        margin: 0;
        color: var(--accent);
        font-size: 17px;
        line-height: 1.35;
      }
      .gloss-group h4 span {
        display: inline;
        margin-left: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }
      .gloss-group .lv {
        font-size: 13px;
        padding: 3px 12px;
      }
      .gloss-group .gg-desc {
        font-size: 13px;
        color: var(--text);
        font-weight: 600;
      }
      .gloss-group .gg-count {
        display: inline-flex;
        align-items: center;
        margin-left: 6px;
        padding: 2px 9px;
        border: 1px solid color-mix(in srgb, var(--accent2) 24%, var(--border));
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent2) 10%, transparent);
        font-size: 12px;
        color: var(--muted);
        font-weight: 800;
        line-height: 1.4;
      }
      .gloss-grid-inner {
        --gloss-card-min: 240px;
        display: grid;
        grid-template-columns: repeat(
          auto-fit,
          minmax(min(100%, var(--gloss-card-min)), 1fr)
        );
        grid-auto-rows: 1fr;
        align-items: stretch;
        gap: 12px;
        margin-bottom: 6px;
      }
      .gloss-item {
        width: 100%;
        height: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;

  <body>
    <div id="progress"></div>

    <header class="reader-header">
  <a class="doc-title-link" href="__SOURCE_URL__" target="_blank" rel="noopener" aria-label="打开原文链接">__HEADER_TITLE__</a>
  <div class="ctrls" aria-label="阅读功能区">
    <div class="seg view-seg" role="group" aria-label="阅读视图">
      <button class="seg-btn active" type="button" data-mode="summary" onclick="setMode('summary',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg>精读</button>
      <button class="seg-btn" type="button" data-mode="original" onclick="setMode('original',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.8-1.2-4-1.8-6.5-1.8C4.7 4.2 4 4.9 4 5.7v11.6c0 .8.7 1.5 1.5 1.4C8 18.6 10.2 19.2 12 20.4"/><path d="M12 6c1.8-1.2 4-1.8 6.5-1.8.8 0 1.5.7 1.5 1.5v11.6c0 .8-.7 1.5-1.5 1.4-2.5-.1-4.7.5-6.5 1.7"/><path d="M12 6v14.4"/></svg>原文</button>
      <button class="seg-btn" type="button" id="glossBtn" data-mode="glossary" onclick="setMode('glossary',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H18a2 2 0 0 1 2 2v13.5"/><path d="M4 5.5v13A1.5 1.5 0 0 0 5.5 20H20"/><path d="M8 8.5h7M8 12h7"/></svg>词汇</button>
    </div>
    <div class="theme-group" role="group" aria-label="主题设置">
      <button class="btn theme-btn" type="button" id="themeBtn" onclick="switchTheme()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>主题</button>
    </div>
  </div>
</header>

    <nav class="toc" id="toc"></nav>

    <div class="wrap">
      <div class="hero" id="hero"></div>

      <section id="glossary">
        <h3 class="sec-title">
          <span class="num">📖</span>
          核心词汇表
        </h3>
        <p style="color: var(--muted); margin: -8px 0 16px; font-size: 13px">
          全文重点词汇汇总，点 🔊 可朗读。点击顶部「精读」或「原文」可切换回阅读视图。
        </p>
        <div class="gloss-grid" id="glossGrid"></div>
      </section>

      <section class="summary-view" data-toc="速览" data-title="全文速览">
        <h3 class="sec-title">
          <span class="num">✨</span>
          全文速览
        </h3>
        <div class="sum-lead" id="sumLead"></div>
        <div class="sum-grid" id="sumGrid"></div>
      </section>

      <div id="sectionsHost"></div>

      <section id="originalSection">
        <h3 class="sec-title">
          <span class="num">📖</span>
          <span id="ogTitle"></span>
        </h3>
        <p id="ogMeta" style="color: var(--muted); margin: -8px 0 18px; font-size: 13px"></p>
        <div id="originalHost"></div>
      </section>
    </div>

    <footer id="footer"></footer>

    <script>
      /* ===================================================================
   数据层 + 主题层（构建时注入，与模板结构完全解耦）。
   THEME.dark / THEME.light 各是一套 CSS 变量；主题切换只换变量。
   =================================================================== */
      const DATA = (window.BILINGUAL_READER_DATA = __DATA_JSON__);
      const THEME = (window.BILINGUAL_READER_THEME = __THEME_JSON__);

      /* ---------- 主题应用 ---------- */
      function applyVars(set) {
        const r = document.documentElement.style;
        Object.keys(set).forEach(k => r.setProperty('--' + k, set[k]));
      }
      function applyTheme(mode) {
        applyVars(mode === 'light' ? THEME.light : THEME.dark);
        if (THEME.style) {
          applyVars(THEME.style);
        }
      }
      applyTheme('dark'); // 默认暗色；THEME.style 含 font/radius/hero-angle 等风格变量

      /* ---------- 渲染层 ---------- */
      const LVC = {B1: 'b1', B2: 'b2', C1: 'c1', C2: 'c2', 术语: 'term'};
      const DICT = DATA.glossary.dict;

      function renderHero() {
        const h = DATA.hero;
        document.getElementById('hero').innerHTML = `<h2>${h.title}</h2>
     <div class="meta">${h.meta || ''}</div>
     <p>${h.en || ''}</p>
     <p class="zh">${h.zh || ''}</p>`;
      }

      function renderSummary() {
        const s = DATA.summary || {};
        document.getElementById('sumLead').innerHTML = s.lead || '';
        document.getElementById('sumGrid').innerHTML = (s.cards || [])
          .map(
            c =>
              `<div class="sum-card"><div class="sci">${c.icon || ''}</div><h4>${c.title}</h4><p>${c.body}</p></div>`,
          )
          .join('');
      }

      function rowHtml(r, index = 0) {
        const rowNo = String(index + 1).padStart(2, '0');
        return (
          `<article class="refactored-row" data-row="${rowNo}">` +
          `<div class="refactored-cell en">${r.en}</div>` +
          `<div class="refactored-cell zh">${r.zh}</div></article>`
        );
      }

      function cardsHtml() {
        return `<div class="cards" id="patternCards"></div>`;
      }
      function quizHtml() {
        return `<div class="quiz" id="quiz"></div>`;
      }
      function summaryBoxHtml(box) {
        const pri = (box.principles || [])
          .map(
            p =>
              `<div class="pri"><div class="big">${p.big || ''}</div><h4>${p.title}</h4>` +
              `<p>${p.en || ''}<br><span style="color:var(--zh)">${p.zh || ''}</span></p></div>`,
          )
          .join('');
        return `<div class="finale-box">
      <div class="finale-head"><span class="finale-mark">08</span><h3>${box.heading || '一句话精髓'}</h3></div>
      ${box.enQuote ? `<p class="finale-quote">${box.enQuote}</p>` : ''}
      ${box.zhQuote ? `<p class="finale-quote zh">${box.zhQuote}</p>` : ''}
      ${box.intro ? `<p class="finale-intro">${box.intro}</p>` : ''}
      ${pri ? `<div class="principles" style="margin-top:18px">${pri}</div>` : ''}
    </div>`;
      }

      function renderSections() {
        const host = document.getElementById('sectionsHost');
        host.innerHTML = (DATA.sections || [])
          .map(s => {
            let inner = '';
            if (s.type === 'cards') {
              inner =
                (s.note
                  ? `<p style="color:var(--muted);margin-top:-6px;margin-bottom:16px">${s.note}</p>`
                  : '') + cardsHtml();
            } else if (s.type === 'quiz') {
              inner = quizHtml();
            } else if (s.type === 'summary') {
              inner = summaryBoxHtml(s.box || {});
            } else {
              inner = (s.rows || []).map((row, index) => rowHtml(row, index)).join('');
            }
            return `<section class="summary-view" data-toc="${s.toc || ''}" data-title="${s.title || s.toc || ''}" data-module="${s.num || ''}">
        <h3 class="sec-title"><span class="num">${s.num || ''}</span>${s.title || ''}</h3>
        ${inner}
      </section>`;
          })
          .join('');
      }

      function renderOriginal() {
        const o = DATA.original || {};
        document.getElementById('ogTitle').textContent = o.title || '原文全文对照';
        document.getElementById('ogMeta').textContent = o.meta || '';
        document.getElementById('originalHost').innerHTML = (o.groups || [])
          .map(
            g =>
              `<div class="og-h">${g.group}</div>` +
              g.rows
                .map(
                  r =>
                    `<div class="row"><div class="cell en">${r.en}</div><div class="cell zh">${r.zh}</div></div>`,
                )
                .join(''),
          )
          .join('');
      }

      function renderFooter() {
        const f = DATA.footer || {};
        document.getElementById('footer').innerHTML = f.sourceUrl
          ? `原文：<a href="${f.sourceUrl}" target="_blank" rel="noopener">《${f.sourceText || f.sourceUrl}》</a>`
          : f.sourceText || '';
      }

      renderHero();
      renderSummary();
      renderSections();
      renderOriginal();
      renderFooter();

      /* ---------- 发音（Web Speech API，浏览器原生，无外部依赖） ---------- */
      function speak(word, ev) {
        if (ev) {
          ev.stopPropagation();
        }
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(word);
          u.lang = 'en-US';
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }

      function canWrapTextNode(node) {
        const parent = node.parentElement;
        if (!parent || !node.nodeValue.trim()) return false;
        return !parent.closest('.w, script, style');
      }
      function isWordPart(ch) {
        return !!ch && /[A-Za-z0-9'’_-]/.test(ch);
      }
      function safeMatchInText(text, re) {
        const flags = re.flags.includes('g') ? re.flags : re.flags + 'g';
        const scanner = new RegExp(re.source, flags);
        let m;
        while ((m = scanner.exec(text))) {
          const word = m[0];
          if (!word) {
            scanner.lastIndex += 1;
            continue;
          }
          const start = m.index || 0;
          const end = start + word.length;
          if (!isWordPart(text[start - 1]) && !isWordPart(text[end])) {
            return {word, start};
          }
        }
        return null;
      }
      function wrapFirstTextMatch(cell, re, key) {
        const walker = document.createTreeWalker(cell, NodeFilter.SHOW_TEXT, {
          acceptNode: node =>
            canWrapTextNode(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
        });
        let node;
        while ((node = walker.nextNode())) {
          re.lastIndex = 0;
          const m = safeMatchInText(node.nodeValue, re);
          if (!m) continue;
          const word = m.word;
          const start = m.start;
          const frag = document.createDocumentFragment();
          const before = node.nodeValue.slice(0, start);
          const after = node.nodeValue.slice(start + word.length);
          if (before) frag.appendChild(document.createTextNode(before));
          const span = document.createElement('span');
          span.className = 'w';
          span.dataset.k = key;
          span.textContent = word;
          const tip = document.createElement('span');
          tip.className = 'tip';
          span.appendChild(tip);
          frag.appendChild(span);
          if (after) frag.appendChild(document.createTextNode(after));
          node.parentNode.replaceChild(frag, node);
          return true;
        }
        return false;
      }

      /* ---------- 原文视图：自动包裹可悬停词（每词仅首次出现处高亮） ---------- */
      function wrapOriginal() {
        const rules = (DATA.glossary.autowrap || []).map(a => [
          new RegExp(a[0], a[1] || 'i'),
          a[2],
        ]);
        const cells = [...document.querySelectorAll('#originalSection .cell.en')];
        rules.forEach(([re, key]) => {
          if (!DICT[key]) return;
          for (const cell of cells) {
            if (wrapFirstTextMatch(cell, re, key)) break;
          }
        });
      }
      wrapOriginal();

      /* ---------- tooltip 填充 + 动态定位 ----------
   tip 从 .w 内部移出并挂到 <body> 顶层，避免被带 transform/filter/overflow
   的内容容器影响 position:fixed 的定位与 stacking context 层级。 */
      document.querySelectorAll('.w').forEach(el => {
        const d = DICT[el.dataset.k];
        if (!d) return;
        const tip = el.querySelector('.tip');
        if (!tip) return;
        const ipaHtml = d.ipa ? `<span class="ipa">${d.ipa}</span>` : '';
        const posHtml = d.pos ? `<span class="pos">${d.pos}</span>` : '';
        tip.innerHTML = `<div class="h"><span class="word">${d.w}</span>
       <button class="speak" title="朗读" onclick="speak('${d.w}',event)">🔊</button></div>
     <div class="sub">${ipaHtml}${posHtml}</div>
     <div class="def">${d.def}</div>
     <div class="eg">${d.eg || ''}<span class="egzh">${d.egzh || ''}</span></div>`;
        document.body.appendChild(tip); // 脱离内容容器，挂到顶层
        let hideTimer = null;
        const show = () => {
          clearTimeout(hideTimer);
          positionTip(el, tip);
          tip.classList.add('tip-open');
        };
        const hide = () => {
          hideTimer = setTimeout(() => tip.classList.remove('tip-open'), 120);
        };
        el.addEventListener('mouseenter', show);
        el.addEventListener('mouseleave', hide);
        el.addEventListener('focusin', show);
        el.addEventListener('focusout', hide);
        // 指针移到浮窗本身时保持显示（浮窗内有朗读按钮）
        tip.addEventListener('mouseenter', () => clearTimeout(hideTimer));
        tip.addEventListener('mouseleave', hide);
      });

      function positionTip(el, tip) {
        const m = 8,
          gap = 6;
        const r = el.getBoundingClientRect();
        const tw = tip.offsetWidth || 290;
        const th = tip.offsetHeight || 160;
        const vw = window.innerWidth,
          vh = window.innerHeight;
        let left = r.left;
        left = Math.max(m, Math.min(left, vw - tw - m));
        let above = false;
        let top = r.bottom + gap;
        if (top + th > vh - m) {
          top = r.top - th - gap;
          above = true;
        }
        top = Math.max(m, Math.min(top, vh - th - m));
        tip.classList.toggle('tip-above', above);
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
      }

      /* 页面滚动时立即收起所有浮窗（CSS filter blur 淡出），避免气泡脱离单词浮在半空 */
      window.addEventListener(
        'scroll',
        () => {
          document.querySelectorAll('.tip.tip-open').forEach(t => t.classList.remove('tip-open'));
        },
        {passive: true},
      );

      /* ---------- 词汇表：按 CEFR 等级分组 ---------- */
      const gg = document.getElementById('glossGrid');
      const ORDER = ['B1', 'B2', 'C1', 'C2', '术语'];
      const LV_DESC = DATA.glossary.groupDesc || {
        B1: '入门进阶 · 日常常用',
        B2: '中级 · 学术与职场高频',
        C1: '高级 · 专业写作词汇',
        C2: '精通 · 地道高阶表达',
        术语: '文章相关专有名词',
      };
      const grouped = {};
      Object.values(DICT).forEach(d => {
        (grouped[d.level] = grouped[d.level] || []).push(d);
      });
      const glossGroups = [];
      ORDER.forEach(lv => {
        const list = grouped[lv];
        if (!list || !list.length) return;
        const lvc = LVC[lv] || '';
        const gid = 'gloss-' + lvc;
        const head = document.createElement('div');
        head.className = 'gloss-group';
        head.id = gid;
        head.style.scrollMarginTop = '80px';
        head.innerHTML = `<span class="lv lv-${lvc}">${lv}</span>
    <span class="gg-desc">${LV_DESC[lv] || ''}</span>
    <span class="gg-count">${list.length} 词</span>`;
        gg.appendChild(head);
        glossGroups.push({id: gid, label: lv});
        const grid = document.createElement('div');
        grid.className = 'gloss-grid-inner';
        list
          .sort((a, b) => a.w.localeCompare(b.w))
          .forEach(d => {
            const div = document.createElement('div');
            div.className = 'gloss-item';
            const ipaHtml = d.ipa ? `<span class="gipa">${d.ipa}</span>` : '';
            div.innerHTML = `<div class="grow"><span class="gw">${d.w}</span>
        <button class="speak" title="朗读" onclick="speak('${d.w}',event)">🔊</button></div>
      ${d.ipa || (d.pos && d.pos !== '术语') ? `<div class="gsub">${ipaHtml}${d.pos && d.pos !== '术语' ? `<span class="gpos">${d.pos}</span>` : ''}</div>` : ''}
      <div class="gdef">${d.def}</div><div class="geg">🗣 ${d.eg || ''}</div>`;
            grid.appendChild(div);
          });
        gg.appendChild(grid);
      });

      /* ---------- 卡片（可选 type:"cards" 章节） ---------- */
      (function () {
        const sec = (DATA.sections || []).find(s => s.type === 'cards');
        const pc = document.getElementById('patternCards');
        if (!pc || !sec) return;
        (sec.cards || []).forEach(p => {
          const c = document.createElement('div');
          c.className = 'card';
          c.innerHTML =
            `<div class="ico">${p.ico || ''}</div><h4>${p.en}</h4>` +
            (p.zh ? `<div class="zhname">${p.zh}</div>` : '') +
            `<div class="body">${p.body || ''}${p.when ? `<div class="when">${p.when}</div>` : ''}</div>`;
          pc.appendChild(c);
        });
      })();

      /* ---------- 测验（可选 type:"quiz" 章节） ---------- */
      (function () {
        const sec = (DATA.sections || []).find(s => s.type === 'quiz');
        const qz = document.getElementById('quiz');
        if (!qz || !sec) return;
        const QUIZ = sec.quiz || [];
        let qi = 0,
          score = 0;
        function renderQuiz() {
          const item = QUIZ[qi];
          qz.innerHTML =
            `<div class="q-txt">Q${qi + 1}. ${item.q}</div>` +
            item.opts
              .map(
                (o, i) =>
                  `<button class="opt" data-i="${i}">${String.fromCharCode(65 + i)}. ${o}</button>`,
              )
              .join('') +
            `<div class="fb"></div><div class="quiz-nav"><small>第 ${qi + 1}/${QUIZ.length} 题 · 得分 ${score}</small><button class="btn" id="nextQ" style="display:none">下一题 →</button></div>`;
          let answered = false;
          qz.querySelectorAll('.opt').forEach(b => {
            b.onclick = () => {
              if (answered) return;
              answered = true;
              const i = +b.dataset.i;
              if (i === item.a) {
                b.classList.add('correct');
                score++;
              } else {
                b.classList.add('wrong');
                qz.querySelectorAll('.opt')[item.a].classList.add('correct');
              }
              qz.querySelector('.fb').textContent = item.fb || '';
              const nb = document.getElementById('nextQ');
              if (qi < QUIZ.length - 1) {
                nb.style.display = 'inline-block';
                nb.onclick = () => {
                  qi++;
                  renderQuiz();
                };
              } else {
                nb.style.display = 'inline-block';
                nb.textContent = '重新测验 ↺';
                nb.onclick = () => {
                  qi = 0;
                  score = 0;
                  renderQuiz();
                };
                qz.querySelector('.fb').textContent +=
                  `  🎉 完成！最终得分 ${score}/${QUIZ.length}`;
              }
            };
          });
        }
        renderQuiz();
      })();

      /* ---------- 视图 / 主题 / 词汇表切换 ---------- */
        function setMode(m, btn) {
          const glossary = document.getElementById('glossary');
          document.body.classList.toggle('mode-original', m === 'original');
          document.body.classList.toggle('gloss-open', m === 'glossary');
          if (glossary) glossary.classList.toggle('show', m === 'glossary');
          document
            .querySelectorAll('.view-seg .seg-btn[data-mode]')
            .forEach(b => b.classList.toggle('active', b.dataset.mode === m));
          if (m === 'glossary') focusGlossary('smooth');
          else focusFirstAnchor(tocLinks, 'smooth');
        }
        function switchTheme() {
        const cur = document.documentElement.getAttribute('data-theme');
        const moonIco =
          '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>';
        const sunIco =
          '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
        if (cur === 'light') {
          document.documentElement.removeAttribute('data-theme');
          applyTheme('dark');
          document.getElementById('themeBtn').innerHTML = moonIco + '主题';
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          applyTheme('light');
          document.getElementById('themeBtn').innerHTML = sunIco + '主题';
        }
      }
      const glossBtn = document.getElementById('glossBtn');
        function openGloss() {
          setMode('glossary', glossBtn);
        }
      function closeGloss() {
          const cur = document.body.classList.contains('mode-original') ? 'original' : 'summary';
          const target = document.querySelector(`.view-seg .seg-btn[data-mode="${cur}"]`);
          if (target) setMode(cur, target);
      }
      function toggleGloss() {
          setMode('glossary', glossBtn);
      }

      /* ---------- 统计 + 进度 + TOC + 滚动追踪 ---------- */
      const toc = document.getElementById('toc');
      const secList = document.querySelectorAll('section[data-toc]');
      secList.forEach((s, i) => {
        s.id = 'sec' + i;
        s.style.scrollMarginTop = '80px';
        const a = document.createElement('a');
        a.className = 'toc-sec';
        a.innerHTML = `<span>${s.dataset.title || s.dataset.toc}</span>`;
        a.addEventListener('mouseenter', () => placeTocLabel(a));
        a.addEventListener('click', () => {
          s.scrollIntoView({behavior: 'smooth', block: 'start'});
        });
        toc.appendChild(a);
      });
      const tocLinks = toc.querySelectorAll('a.toc-sec');
      function placeTocLabel(a) {
        const r = a.getBoundingClientRect();
        const goRight = r.left + r.width / 2 < window.innerWidth / 2;
        a.classList.toggle('label-right', goRight);
      }
      function placeVisibleTocLabels() {
        toc.querySelectorAll('a').forEach(placeTocLabel);
      }
      function focusFirstAnchor(links, behavior = 'auto') {
        const first = Array.from(links || []).find(a => a.classList.contains('toc-sec'));
        if (!first) return;
        requestAnimationFrame(() => secList[0].scrollIntoView({behavior, block: 'start'}));
      }
      function focusGlossary(behavior = 'auto') {
        const target = document.getElementById('glossary');
        if (!target) return;
        requestAnimationFrame(() => target.scrollIntoView({behavior, block: 'start'}));
      }
      function onScroll() {
        const h = document.documentElement;
        const sc = h.scrollTop,
          max = h.scrollHeight - h.clientHeight;
        const pct = max > 0 ? sc / max : 0;
        const atBottom = max <= 0 || sc >= max - 2;
        document.getElementById('progress').style.width = pct * 100 + '%';
        if (document.body.classList.contains('gloss-open')) {
          tocLinks.forEach(a => a.classList.remove('active'));
          placeVisibleTocLabels();
          return;
        }
        let cur = 0;
        secList.forEach((s, i) => {
          if (s.getBoundingClientRect().top < 200) cur = i;
        });
        if (atBottom && secList.length) cur = secList.length - 1;
        tocLinks.forEach((a, i) => a.classList.toggle('active', i === cur));
        placeVisibleTocLabels();
      }
      window.addEventListener('scroll', onScroll);
      window.addEventListener('resize', placeVisibleTocLabels);
      focusFirstAnchor(tocLinks);
      onScroll();
    </script>
  </body>
</html>
