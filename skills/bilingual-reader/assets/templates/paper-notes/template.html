<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__PAGE_TITLE__</title>
<!-- bilingual-reader-template
name: paper-notes
style: 独立整页模板 · 路线 / 站点式阅读流
structure: 胶囊顶栏 + 站台封面 + 纵向连线 timeline 站点 + 途中检查点 + 终点收获卡
-->
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef2fb; --border:#dce3f2;
    --text:#1d2433; --muted:#6b7689; --en:#28324a; --zh:#7a3da8;
    --accent:#6b54ff; --accent2:#ff7aa8; --green:#21b573; --tip-bg:#ffffff;
    --accent-ink:#ffffff; --accent2-ink:#3a0a1c; --accent-shadow:rgba(107,84,255,.28);
    --hl:rgba(107,84,255,.1);
    --radius:16px; --radius-lg:22px; --radius-sm:11px;
    --font:"Segoe UI",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --hero-angle:135deg;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; color:var(--text); font-family:var(--font); font-size:15px; line-height:1.7;
    background:
      radial-gradient(circle at 0% 0%,rgba(107,84,255,.12),transparent 38%),
      radial-gradient(circle at 100% 8%,rgba(255,122,168,.12),transparent 36%),var(--bg);
    transition:background .3s,color .3s}
  __RUNTIME_CSS__

  /* —— 胶囊顶栏（固定） —— */
  header{position:sticky; top:0; z-index:900; backdrop-filter:blur(12px);
    background:color-mix(in srgb,var(--bg) 75%,transparent);
    padding:12px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  header h1{font-size:16px; margin:0; flex:1; min-width:160px; font-weight:800}
  header h1 span{color:var(--accent)}
  .ctrls{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
  .seg{display:inline-flex; background:var(--panel); border:1px solid var(--border); border-radius:999px;
    padding:4px; gap:3px; box-shadow:0 6px 20px rgba(50,60,120,.08)}
  .seg-btn{display:inline-flex; align-items:center; gap:6px; background:transparent; color:var(--muted);
    border:none; cursor:pointer; padding:7px 15px; border-radius:999px; font-size:13px; transition:.2s; white-space:nowrap}
  .seg-btn .ico{width:15px; height:15px; flex-shrink:0}
  .seg-btn:hover{color:var(--accent)}
  .seg-btn.active{background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff; font-weight:700; box-shadow:0 6px 16px var(--accent-shadow)}

  .wrap{max-width:1040px; margin:0 auto; padding:18px 22px 80px}

  /* —— Hero：站台封面 —— */
  .hero{position:relative; overflow:hidden; border-radius:var(--radius-lg);
    background:linear-gradient(var(--hero-angle),var(--accent),var(--accent2)); color:#fff;
    padding:34px 32px; margin-bottom:28px; box-shadow:0 24px 60px var(--accent-shadow)}
  .hero::after{content:"🚉"; position:absolute; right:24px; bottom:14px; font-size:72px; opacity:.22}
  .hero .badge{display:inline-block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    background:rgba(255,255,255,.22); padding:4px 12px; border-radius:999px; margin-bottom:12px}
  .hero h2{margin:0 0 8px; font-size:30px; line-height:1.2; max-width:80%}
  .hero .meta{font-size:13px; opacity:.9; margin-bottom:14px}
  .hero .en{margin:6px 0; opacity:.96}
  .hero .zh{margin:6px 0; opacity:.96}

  section{margin-bottom:34px}
  .sec-title{display:flex; align-items:center; gap:12px; font-size:21px; font-weight:800; margin:0 0 18px}
  .sec-title .num{width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff;
    display:grid; place-items:center; font-size:14px; font-weight:800; box-shadow:0 8px 18px var(--accent-shadow)}
  .note{color:var(--muted); font-size:13px; margin:-10px 0 16px}

  /* —— Summary：路线总览 + 站点卡 —— */
  .sum-lead{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 24px; margin-bottom:18px; box-shadow:0 12px 30px rgba(50,60,120,.06)}
  .sum-lead b{color:var(--accent)}
  .sum-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px}
  .sum-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; transition:.25s; box-shadow:0 10px 26px rgba(50,60,120,.06)}
  .sum-card:hover{transform:translateY(-4px); box-shadow:0 18px 38px rgba(50,60,120,.12)}
  .sum-card .ico{width:32px; height:32px; border-radius:10px; background:var(--hl); color:var(--accent);
    display:grid; place-items:center; font-weight:800; margin-bottom:10px}
  .sum-card h4{margin:0 0 6px; color:var(--accent); font-size:16px}
  .sum-card p{margin:0; color:var(--en); font-size:14px}

  /* —— Sections rows：站点 timeline（纵向连线） ——
     轴心 X = 19px：虚线（border-left 2px，18→20px，中心 19）与
     圆点中心（stop 左边 36 + own-left -25 + 半径 8 = 19）精确对齐。 */
  .route{position:relative; padding-left:36px}
  .route::before{content:""; position:absolute; left:18px; top:8px; bottom:8px; width:0;
    border-left:2px dashed color-mix(in srgb,var(--accent) 32%,var(--border))}
  .stop{position:relative; margin-bottom:18px}
  .stop::before{content:""; box-sizing:border-box; position:absolute; left:-25px; top:20px; width:16px; height:16px; border-radius:50%;
    background:var(--panel); border:3px solid var(--accent); box-shadow:0 0 0 4px var(--hl)}
  .stop-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:0; overflow:hidden; box-shadow:0 10px 26px rgba(50,60,120,.06); transition:.2s}
  .stop-card:hover{transform:translateX(3px); box-shadow:0 16px 34px rgba(50,60,120,.12)}
  .stop-no{font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--accent); padding:9px 18px 0}
  .stop-en{padding:4px 18px 12px; color:var(--en); font-size:15px}
  .stop-zh{padding:12px 18px; color:var(--zh); font-size:14.5px; background:var(--panel2); border-top:1px dashed var(--border)}

  /* —— Cards：站点要点卡 —— */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; transition:.25s; box-shadow:0 10px 26px rgba(50,60,120,.06)}
  .card:hover{transform:translateY(-4px); box-shadow:0 18px 38px rgba(50,60,120,.12)}
  .card .top{display:flex; align-items:center; gap:10px}
  .card .tag{width:30px; height:30px; border-radius:10px; background:linear-gradient(120deg,var(--accent),var(--accent2));
    color:#fff; display:grid; place-items:center; font-size:13px; font-weight:800; flex-shrink:0}
  .card h4{margin:0; font-size:15px; color:var(--accent)}
  .card .zhname{font-size:12.5px; color:var(--muted)}
  .card .body{font-size:13.5px; color:var(--en); margin-top:10px}
  .card .when{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); color:var(--zh)}

  /* —— Quiz：途中检查点 —— */
  .quiz{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 24px; box-shadow:0 12px 30px rgba(50,60,120,.06)}
  .quiz .q-txt{font-size:16px; font-weight:600; margin-bottom:14px}
  .quiz .q-txt::before{content:"🚩 "}
  .quiz .opt{display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--border);
    border-radius:12px; padding:11px 16px; margin-bottom:9px; cursor:pointer; color:var(--text); font-size:14px; transition:.18s}
  .quiz .opt:hover{border-color:var(--accent)}
  .quiz .opt.correct{background:rgba(33,181,115,.16); border-color:var(--green)}
  .quiz .opt.wrong{background:rgba(255,90,120,.16); border-color:#ff5a78}
  .quiz .fb{margin-top:10px; font-size:14px; color:var(--muted); min-height:20px}
  .quiz-nav{display:flex; justify-content:space-between; align-items:center; margin-top:12px}
  .quiz-nav small{color:var(--muted)}
  .btn{background:var(--panel2); color:var(--text); border:1px solid var(--border); padding:8px 16px;
    border-radius:999px; cursor:pointer; font-size:13px}
  .btn:hover{border-color:var(--accent); color:var(--accent)}

  /* —— Summary box：终点收获 —— */
  .summary-box{border-radius:var(--radius-lg); padding:26px 28px; color:#fff;
    background:linear-gradient(var(--hero-angle),var(--accent),var(--accent2)); box-shadow:0 24px 56px var(--accent-shadow)}
  .summary-box h3{margin:0 0 14px; font-size:19px}
  .summary-box h3::before{content:"🏁 "}
  .summary-box .q{font-size:15px; border-left:3px solid rgba(255,255,255,.6); padding-left:14px; margin:10px 0}
  .summary-box .q.zh{opacity:.95}
  .pri-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-top:16px}
  .pri{background:rgba(255,255,255,.16); border-radius:14px; padding:14px; text-align:center}
  .pri .big{font-size:24px; font-weight:800}
  .pri h4{margin:4px 0; font-size:14px}
  .pri p{margin:0; font-size:12.5px; opacity:.92}

  /* —— Original：完整线路图 —— */
  .og-h{margin:22px 0 14px; font-size:17px; font-weight:800; color:var(--accent);
    display:flex; align-items:center; gap:10px}
  .og-h::before{content:"🗺"; font-size:18px}
  .og-row{display:grid; grid-template-columns:1fr 1fr; gap:0; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); margin-bottom:12px; overflow:hidden; box-shadow:0 8px 20px rgba(50,60,120,.05)}
  .og-row .en{padding:14px 18px; color:var(--en); border-right:1px solid var(--border)}
  .og-row .zh{padding:14px 18px; color:var(--zh); background:var(--panel2)}

  /* —— Glossary：词汇站点册 —— */
  #glossary{display:none}
  #glossary.show{display:block}
  .gloss-group{display:block; margin:20px 0 12px; padding-bottom:8px; border-bottom:2px solid var(--border)}
  .gloss-group .gg-desc{font-size:13px; color:var(--text); font-weight:600}
  .gloss-group .gg-count{margin-left:auto; font-size:12px; color:var(--muted)}
  .gloss-grid-inner{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-bottom:6px}
  .gloss-item{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow:0 8px 20px rgba(50,60,120,.05)}
  .gloss-item .grow{display:flex; align-items:center; gap:8px}
  .gloss-item .word,.gloss-item .gw{display:inline-block; font-weight:900; color:var(--accent); font-size:21px; line-height:1.08; letter-spacing:.05em; text-shadow:0 0 12px color-mix(in srgb,var(--accent) 22%,transparent)}
  .gloss-item .gsub{display:flex; align-items:center; gap:8px; margin-top:3px}
  .gloss-item .gipa{color:var(--accent2); font-size:12px; font-family:Georgia,serif}
  .gloss-item .gpos{font-size:10px; background:var(--accent2); color:#fff; padding:1px 7px; border-radius:6px; font-style:italic}
  .gloss-item .gdef{font-size:13px; color:var(--text); margin-top:6px}
  .gloss-item .geg{font-size:12px; color:var(--muted); font-style:italic; margin-top:4px}

  footer{text-align:center; color:var(--muted); font-size:12px; padding:18px; margin-top:30px}
  footer a{color:var(--accent)}

  .toc{position:fixed; right:16px; top:50%; transform:translateY(-50%); z-index:800;
    display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px 11px; border-radius:30px;
    background:color-mix(in srgb,var(--panel) 80%,transparent); border:1px solid var(--border);
    backdrop-filter:blur(8px); box-shadow:0 12px 34px rgba(50,60,120,.12)}
  .toc a{width:11px; height:11px; border-radius:50%; background:var(--border); cursor:pointer; transition:.28s; position:relative; flex-shrink:0}
  .toc a:hover{background:var(--accent2); transform:scale(1.25)}
  .toc a.active{background:linear-gradient(var(--accent),var(--accent2)); width:11px; height:26px; border-radius:8px}
  .toc a span{position:absolute; right:24px; top:50%; transform:translateY(-50%) translateX(6px); white-space:nowrap;
    background:var(--panel); border:1px solid var(--accent); padding:4px 11px; border-radius:8px; font-size:12px;
    opacity:0; pointer-events:none; transition:.2s; color:var(--text); box-shadow:0 6px 16px rgba(50,60,120,.14)}
  .toc a:hover span{opacity:1; transform:translateY(-50%)}

  body.mode-original .summary-view{display:none}
  body.mode-original #originalSection{display:block}
  #originalSection{display:none}
  body.mode-original .toc,body.gloss-open .toc{display:none}
  body.gloss-open .hero,body.gloss-open .summary-view,body.gloss-open #originalSection{display:none!important}

  @media(max-width:760px){
    .toc{display:none}
    .hero h2{max-width:100%; font-size:24px}
    .og-row{grid-template-columns:1fr}
    .og-row .en{border-right:none; border-bottom:1px solid var(--border)}
  }

  .doc-title-link{display:block;flex:1;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}
  .doc-title-link:hover{color:var(--accent)}
  .reader-header .ctrls{margin-left:auto;justify-content:flex-end}
  .theme-group{display:inline-flex;align-items:center}
  .theme-btn{display:inline-flex;align-items:center;gap:6px}
  .theme-btn .ico{width:15px;height:15px;flex-shrink:0}

</style>
</head>
<body>
<div id="progress"></div>

<header class="reader-header">
  <a class="doc-title-link" href="__SOURCE_URL__" target="_blank" rel="noopener" aria-label="打开原文链接">__HEADER_TITLE__</a>
  <div class="ctrls" aria-label="阅读功能区">
    <div class="seg view-seg" role="group" aria-label="阅读视图">
      <button class="seg-btn active" type="button" data-mode="summary" onclick="setMode('summary',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg>精读</button>
      <button class="seg-btn" type="button" data-mode="original" onclick="setMode('original',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.8-1.2-4-1.8-6.5-1.8C4.7 4.2 4 4.9 4 5.7v11.6c0 .8.7 1.5 1.5 1.4C8 18.6 10.2 19.2 12 20.4"/><path d="M12 6c1.8-1.2 4-1.8 6.5-1.8.8 0 1.5.7 1.5 1.5v11.6c0 .8-.7 1.5-1.5 1.4-2.5-.1-4.7.5-6.5 1.7"/><path d="M12 6v14.4"/></svg>原文</button>
      <button class="seg-btn" type="button" id="glossBtn" data-mode="glossary" onclick="setMode('glossary',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H18a2 2 0 0 1 2 2v13.5"/><path d="M4 5.5v13A1.5 1.5 0 0 0 5.5 20H20"/><path d="M8 8.5h7M8 12h7"/></svg>词汇</button>
    </div>
    <div class="theme-group" role="group" aria-label="主题设置">
      <button class="btn theme-btn" type="button" id="themeBtn" onclick="switchTheme()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>主题</button>
    </div>
  </div>
</header>

<nav class="toc" id="toc"></nav>

<div class="wrap">
  <div class="hero" id="hero"></div>

  <section id="glossary">
    <h3 class="sec-title"><span class="num">📖</span>词汇站点册</h3>
    <p class="note">沿途重点词汇按 CEFR 分级，点 🔊 朗读。点击顶部「精读」或「原文」可切换回阅读视图。</p>
    <div id="glossGrid"></div>
  </section>

  <div id="contentHost"></div>

  <section id="originalSection">
    <h3 class="sec-title"><span class="num">🗺</span><span id="ogTitle"></span></h3>
    <p class="note" id="ogMeta"></p>
    <div id="originalHost"></div>
  </section>
</div>

<footer id="footer"></footer>

<script>
window.BILINGUAL_READER_DATA = __DATA_JSON__;
window.BILINGUAL_READER_THEME = __THEME_JSON__;
const DATA = window.BILINGUAL_READER_DATA, THEME = window.BILINGUAL_READER_THEME;
</script>
<script>
__RUNTIME_JS__
</script>
<script>
/* ===== paper-notes：路线 / 站点式阅读流的页面骨架与渲染 ===== */
const esc = BR.escapeHtml;

function renderHero(){
  const h=DATA.hero||{};
  document.getElementById('hero').innerHTML=
    `<span class="badge">route · 出发说明</span>`+
    `<h2>${esc(h.title)}</h2>`+
    (h.meta?`<div class="meta">${esc(h.meta)}</div>`:'')+
    (h.en?`<p class="en">${esc(h.en)}</p>`:'')+
    (h.zh?`<p class="zh">${esc(h.zh)}</p>`:'');
}

function sectionBlock(inner,toc,title,num){
  return `<section class="summary-view" data-toc="${esc(toc||'')}" data-title="${esc(title||toc||'')}">
      <h3 class="sec-title"><span class="num">${esc(num||'')}</span>${esc(title||'')}</h3>${inner}</section>`;
}

function renderContent(){
  const host=document.getElementById('contentHost');
  let html='';
  const s=DATA.summary||{};
  if(s.lead||s.cards){
    let inner=(s.lead?`<div class="sum-lead">${s.lead}</div>`:'')+
      `<div class="sum-grid">`+(s.cards||[]).map(c=>
        `<div class="sum-card"><div class="ico">${esc(c.icon||'')}</div><h4>${esc(c.title)}</h4><p>${esc(c.body)}</p></div>`).join('')+`</div>`;
    html+=sectionBlock(inner,'总览','路线总览','✨');
  }
  (DATA.sections||[]).forEach(sec=>{
    let inner='';
    if(sec.type==='cards'){
      inner=(sec.note?`<p class="note">${esc(sec.note)}</p>`:'')+`<div class="cards" data-cards="1"></div>`;
    }else if(sec.type==='quiz'){
      inner=`<div class="quiz" data-quiz="1"></div>`;
    }else if(sec.type==='summary'){
      inner=summaryBoxHtml(sec.box||{});
    }else{
      inner=`<div class="route">`+(sec.rows||[]).map((r,i)=>
        `<div class="stop"><div class="stop-card"><div class="stop-no">STOP ${String(i+1).padStart(2,'0')}</div>`+
        `<div class="stop-en">${r.en}</div><div class="stop-zh">${esc(r.zh)}</div></div></div>`).join('')+`</div>`;
    }
    html+=sectionBlock(inner,sec.toc,sec.title,sec.num);
  });
  host.innerHTML=html;
  hydrateCards(); hydrateQuiz();
}

function summaryBoxHtml(box){
  const pri=(box.principles||[]).map(p=>
    `<div class="pri"><div class="big">${esc(p.big||'')}</div><h4>${esc(p.title||'')}</h4>`+
    `<p>${esc(p.en||'')}<br>${esc(p.zh||'')}</p></div>`).join('');
  return `<div class="summary-box"><h3>${esc(box.heading||'终点收获')}</h3>`+
    (box.enQuote?`<div class="q">${esc(box.enQuote)}</div>`:'')+
    (box.zhQuote?`<div class="q zh">${esc(box.zhQuote)}</div>`:'')+
    (box.intro?`<p style="font-size:14px;margin:12px 0 0;opacity:.95">${esc(box.intro)}</p>`:'')+
    (pri?`<div class="pri-strip">${pri}</div>`:'')+`</div>`;
}

function hydrateCards(){
  const sec=(DATA.sections||[]).find(s=>s.type==='cards');
  const host=document.querySelector('[data-cards]');
  if(!sec||!host)return;
  (sec.cards||[]).forEach(p=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<div class="top"><span class="tag">${esc(p.ico||'')}</span><div><h4>${esc(p.en)}</h4>`+
      (p.zh?`<div class="zhname">${esc(p.zh)}</div>`:'')+`</div></div>`+
      `<div class="body">${esc(p.body||'')}${p.when?`<div class="when">${esc(p.when)}</div>`:''}</div>`;
    host.appendChild(c);
  });
}

function hydrateQuiz(){
  const sec=(DATA.sections||[]).find(s=>s.type==='quiz');
  const qz=document.querySelector('[data-quiz]');
  if(!sec||!qz)return;
  const QUIZ=sec.quiz||[]; let qi=0,score=0;
  function render(){
    const item=QUIZ[qi];
    qz.innerHTML=`<div class="q-txt">检查点 ${qi+1}. ${esc(item.q)}</div>`+
      item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')+
      `<div class="fb"></div><div class="quiz-nav"><small>第 ${qi+1}/${QUIZ.length} 站 · 得分 ${score}</small><button class="btn" id="nextQ" style="display:none">下一站 →</button></div>`;
    let answered=false;
    qz.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{
        if(answered)return; answered=true;
        const i=+b.dataset.i;
        if(i===item.a){b.classList.add('correct');score++;}
        else{b.classList.add('wrong');qz.querySelectorAll('.opt')[item.a].classList.add('correct');}
        qz.querySelector('.fb').textContent=item.fb||'';
        const nb=document.getElementById('nextQ');
        if(qi<QUIZ.length-1){nb.style.display='inline-block';nb.onclick=()=>{qi++;render();};}
        else{nb.style.display='inline-block';nb.textContent='重新出发 ↺';nb.onclick=()=>{qi=0;score=0;render();};
          qz.querySelector('.fb').textContent+=`  🎉 抵达终点！最终得分 ${score}/${QUIZ.length}`;}
      };
    });
  }
  render();
}

function renderOriginalRow(r){
  if(r.type==='image'){
    const cap=r.caption?`<figcaption>${esc(r.caption)}</figcaption>`:'';
    return `<figure class="og-media"><img src="${esc(r.src||'')}" alt="${esc(r.alt||'')}" width="720" height="405" loading="lazy" decoding="async" style="display:block;width:min(720px,100%);height:405px;object-fit:contain;margin:0 auto;">${cap}</figure>`;
  }
  return `<div class="og-row"><div class="en">${esc(r.en)}</div><div class="zh">${esc(r.zh)}</div></div>`;
}

function renderOriginal(){
  const o=DATA.original||{};
  document.getElementById('ogTitle').textContent=o.title||'完整线路图';
  document.getElementById('ogMeta').textContent=o.meta||'';
  document.getElementById('originalHost').innerHTML=(o.groups||[]).map(g=>
    `<div class="og-h">${esc(g.group)}</div>`+
    (g.rows||[]).map(renderOriginalRow).join('')
  ).join('');
}

function renderGlossary(){
  const host=document.getElementById('glossGrid');
  const groups=BR.groupGlossary(); const links=[];
  host.innerHTML=groups.map(g=>{
    const gid='gloss-'+g.lvc;
    links.push({id:gid,label:g.level});
    const items=g.items.map(d=>
      `<div class="gloss-item"><div class="grow"><span class="gw">${esc(d.w)}</span>`+
      `<button class="speak" title="朗读" data-speak="${esc(d.w)}">🔊</button></div>`+
      `${(d.ipa || (d.pos && d.pos !== "术语")) ? `<div class="gsub">${d.ipa ? `<span class="gipa">${esc(d.ipa)}</span>` : ""}${d.pos && d.pos !== "术语" ? `<span class="gpos">${esc(d.pos)}</span>` : ""}</div>` : ""}`+
      `<div class="gdef">${esc(d.def)}</div><div class="geg">🗣 ${esc(d.eg||'')}</div></div>`).join('');
    return `<div class="gloss-group" id="${gid}" style="scroll-margin-top:80px"><span class="lv lv-${g.lvc}">${esc(g.level)}</span>`+
      `<span class="gg-desc">${esc(g.desc)}</span><span class="gg-count">${g.items.length} 词</span></div>`+
      `<div class="gloss-grid-inner">${items}</div>`;
  }).join('');
  host.querySelectorAll('[data-speak]').forEach(b=>b.addEventListener('click',e=>BR.speak(b.getAttribute('data-speak'),e)));
  return links;
}

function renderFooter(){
  const f=DATA.footer||{};
  document.getElementById('footer').innerHTML=f.sourceUrl?
    `原文：<a href="${esc(f.sourceUrl)}" target="_blank" rel="noopener">《${esc(f.sourceText||f.sourceUrl)}》</a>`:esc(f.sourceText||'');
}

/* ===== 控制 ===== */
function scrollToActiveFirstAnchor(behavior='auto'){
  const target=document.querySelector('section[data-toc]');
  if(target)requestAnimationFrame(()=>target.scrollIntoView({behavior,block:'start'}));
}
function scrollToGlossaryTop(behavior='auto'){
  const target=document.getElementById('glossary');
  if(target)requestAnimationFrame(()=>target.scrollIntoView({behavior,block:'start'}));
}
function setMode(m,btn){
  const glossary=document.getElementById('glossary');
  document.body.classList.toggle('mode-original',m==='original');
  document.body.classList.toggle('gloss-open',m==='glossary');
  if(glossary)glossary.classList.toggle('show',m==='glossary');
  document.querySelectorAll('.view-seg .seg-btn[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  if(m==='glossary')scrollToGlossaryTop('smooth');
  else scrollToActiveFirstAnchor('smooth');
}
function switchTheme(){
  const mode=BR.toggleTheme();
  const moon='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>';
  const sun='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  document.getElementById('themeBtn').innerHTML=(mode==='light'?sun:moon)+'主题';
}
const glossBtn=document.getElementById("glossBtn");
function openGloss(){setMode('glossary',glossBtn);}
function closeGloss(){
  const cur=document.body.classList.contains('mode-original')?'original':'summary';
  const target=document.querySelector(`.view-seg .seg-btn[data-mode="${cur}"]`);
  if(target)setMode(cur,target);
}
function toggleGloss(){setMode('glossary',glossBtn);}

/* ===== 初始化 ===== */
renderHero(); renderContent(); renderOriginal(); renderGlossary(); renderFooter();
BR.autowrap(document.querySelectorAll('#originalSection .og-row .en'));
BR.mountTooltips(document);

const toc=document.getElementById("toc");
let secList=document.querySelectorAll("section[data-toc]");
let tocLinks=[];
secList.forEach((s,i)=>{s.id="sec"+i; s.style.scrollMarginTop="80px";});
tocLinks=renderToc(sectionAnchors());
BR.initProgress((pct,sc,max)=>{
  if(document.body.classList.contains("gloss-open")){
    let gc=0;
    const groups=document.querySelectorAll(".gloss-group");
    groups.forEach((g,i)=>{if(g.getBoundingClientRect().top<160)gc=i;});
    if(max<=0||sc>=max-2){gc=groups.length-1;}
    tocLinks.forEach((a,i)=>a.classList.toggle("active",i===gc));
    return;
  }
  let cur=0; secList.forEach((s,i)=>{if(s.getBoundingClientRect().top<170)cur=i;});
  if(max<=0||sc>=max-2){cur=secList.length-1;}
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
});
scrollToActiveFirstAnchor();
</script>
