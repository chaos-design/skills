<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__PAGE_TITLE__</title>
<!-- bilingual-reader-template
name: midnight-lab
style: 独立整页模板 · 实验记录 / 证据块（终端风）
structure: 终端顶栏 + $ 实验封面 + SOURCE/TRANSLATION 上下堆叠证据块 + 自测断言 + 结论清单
-->
<style>
  :root{
    --bg:#0a0e14; --panel:#0f141d; --panel2:#141b26; --border:#243040;
    --text:#d7e2ef; --muted:#7c8b9e; --en:#c4d2e3; --zh:#9fe6c8;
    --accent:#39d98a; --accent2:#4aa8ff; --green:#39d98a; --tip-bg:#0a141f;
    --accent-ink:#04130c; --accent2-ink:#021018; --accent-shadow:rgba(57,217,138,.32);
    --hl:rgba(57,217,138,.12);
    --radius:8px; --radius-lg:10px; --radius-sm:6px;
    --font:"SF Mono","JetBrains Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
    --hero-angle:135deg;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:
      radial-gradient(circle at 12% -5%,rgba(74,168,255,.08),transparent 40%),
      radial-gradient(circle at 100% 0,rgba(57,217,138,.07),transparent 36%),var(--bg);
    color:var(--text); font-family:var(--font); font-size:14px; line-height:1.65; transition:background .3s,color .3s}
  __RUNTIME_CSS__

  /* —— 终端顶栏（固定） —— */
  header{position:sticky; top:0; z-index:900; backdrop-filter:blur(10px);
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    border-bottom:1px solid var(--border); padding:9px 18px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  header::before{content:""; width:46px; height:11px; flex-shrink:0;
    background:radial-gradient(circle at 5px center,#ff5f56 4px,transparent 4.5px),
      radial-gradient(circle at 21px center,#ffbd2e 4px,transparent 4.5px),
      radial-gradient(circle at 37px center,#27c93f 4px,transparent 4.5px)}
  header h1{font-size:13px; margin:0; flex:1; min-width:160px; font-weight:600; color:var(--muted); letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  .ctrls{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .seg{display:inline-flex; background:var(--panel2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:2px; gap:2px}
  .seg-btn{display:inline-flex; align-items:center; gap:6px; background:transparent; color:var(--muted);
    border:none; cursor:pointer; padding:5px 11px; border-radius:5px; font-size:12px; font-family:inherit; transition:.2s; white-space:nowrap}
  .seg-btn .ico{width:14px; height:14px; flex-shrink:0}
  .seg-btn:hover{color:var(--accent)}
  .seg-btn.active{background:var(--accent); color:var(--accent-ink); font-weight:700}

  .wrap{max-width:1080px; margin:0 auto; padding:24px 20px 70px}

  /* —— Hero：实验封面 —— */
  .hero{border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;
    background:linear-gradient(var(--hero-angle),var(--panel),var(--panel2)); margin-bottom:26px}
  .hero .bar{display:flex; align-items:center; gap:8px; padding:7px 14px; border-bottom:1px solid var(--border);
    background:color-mix(in srgb,var(--accent) 8%,transparent); font-size:11px; color:var(--muted)}
  .hero .bar b{color:var(--accent)}
  .hero .body{padding:22px 24px}
  .hero h2{margin:0 0 4px; font-size:24px; line-height:1.3; color:var(--text)}
  .hero h2::before{content:"$ "; color:var(--accent)}
  .hero .meta{color:var(--muted); font-size:12px; margin-bottom:14px}
  .hero .meta::before{content:"# run: "; color:var(--accent2)}
  .hero .abstract{border-left:2px solid var(--accent2); padding-left:14px}
  .hero .abstract .en{color:var(--en); margin:4px 0}
  .hero .abstract .zh{color:var(--zh); margin:4px 0}

  section{margin-bottom:30px}
  .sec-title{display:flex; align-items:center; gap:10px; font-size:17px; margin:0 0 16px;
    padding-bottom:9px; border-bottom:1px dashed var(--border); color:var(--text)}
  .sec-title .num{background:var(--panel2); color:var(--accent); border:1px solid var(--accent);
    min-width:34px; height:26px; padding:0 10px; border-radius:6px; display:inline-flex; align-items:center;
    justify-content:center; white-space:nowrap; font-size:12px; font-weight:700; line-height:1; flex-shrink:0}
  .sec-title .num::before{content:"#"}
  .note{color:var(--muted); font-size:12.5px; margin:-6px 0 14px}

  /* —— Summary：实验摘要 + 观察项 —— */
  .sum-lead{border:1px solid var(--border); border-left:3px solid var(--accent2); border-radius:var(--radius);
    background:var(--panel); padding:16px 18px; margin-bottom:16px; color:var(--text)}
  .sum-lead::before{content:"// abstract"; display:block; color:var(--accent2); font-size:11px; margin-bottom:6px}
  .sum-lead b{color:var(--accent)}
  .sum-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
  .sum-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; position:relative}
  .sum-card .ico{position:absolute; top:12px; right:14px; font-size:11px; color:var(--accent); opacity:.7}
  .sum-card .ico::before{content:"obs."}
  .sum-card h4{margin:0 0 6px; color:var(--accent); font-size:14px}
  .sum-card p{margin:0; color:var(--en); font-size:13px}

  /* —— Sections rows：SOURCE / TRANSLATION 证据块（左右对比） —— */
  .evidence{border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:14px;
    background:var(--panel); transition:.2s; display:grid; grid-template-columns:1fr 1fr}
  .evidence:hover{border-color:var(--accent2)}
  .ev-part{padding:13px 16px}
  .ev-part.src{border-right:1px dashed var(--border)}
  .ev-tag{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.12em; padding:1px 8px;
    border-radius:4px; margin-bottom:7px}
  .ev-part.src .ev-tag{background:color-mix(in srgb,var(--accent2) 20%,transparent); color:var(--accent2)}
  .ev-part.tr .ev-tag{background:color-mix(in srgb,var(--accent) 18%,transparent); color:var(--accent)}
  .ev-part.src{color:var(--en); font-size:14px}
  .ev-part.tr{color:var(--zh); font-size:14px; background:color-mix(in srgb,var(--panel2) 60%,transparent)}
  .ev-no{float:right; font-size:11px; color:var(--muted); display: none;}
  @media(max-width:720px){
    .evidence{grid-template-columns:1fr}
    .ev-part.src{border-right:none; border-bottom:1px dashed var(--border)}
  }

  /* —— Cards：实验方法卡 —— */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; transition:.2s}
  .card:hover{border-color:var(--accent)}
  .card .top{display:flex; align-items:center; gap:9px}
  .card .tag{width:24px; height:24px; border-radius:5px; background:var(--accent); color:var(--accent-ink);
    display:grid; place-items:center; font-size:12px; font-weight:800; flex-shrink:0}
  .card h4{margin:0; font-size:14px; color:var(--accent)}
  .card .zhname{font-size:12px; color:var(--muted)}
  .card .body{font-size:13px; color:var(--en); margin-top:8px}
  .card .when{margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); color:var(--zh)}
  .card .when::before{content:"when: "; color:var(--accent2)}

  /* —— Quiz：自测断言 —— */
  .quiz{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px}
  .quiz .q-txt{font-size:15px; margin-bottom:12px}
  .quiz .q-txt::before{content:"assert> "; color:var(--accent)}
  .quiz .opt{display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--border);
    border-radius:6px; padding:10px 14px; margin-bottom:8px; cursor:pointer; color:var(--text); font-family:inherit; font-size:13px; transition:.15s}
  .quiz .opt:hover{border-color:var(--accent2)}
  .quiz .opt.correct{background:rgba(57,217,138,.2); border-color:var(--green)}
  .quiz .opt.wrong{background:rgba(255,95,86,.2); border-color:#ff5f56}
  .quiz .fb{margin-top:10px; font-size:13px; color:var(--muted); min-height:18px}
  .quiz-nav{display:flex; justify-content:space-between; align-items:center; margin-top:12px}
  .quiz-nav small{color:var(--muted); font-size:12px}
  .btn{background:var(--panel2); color:var(--text); border:1px solid var(--border); padding:7px 13px;
    border-radius:6px; cursor:pointer; font-family:inherit; font-size:12px}
  .btn:hover{border-color:var(--accent); color:var(--accent)}

  /* —— Summary box：结论清单 —— */
  .summary-box{border:1px solid var(--accent); border-radius:var(--radius-lg);
    background:linear-gradient(var(--hero-angle),var(--panel),var(--panel2)); padding:20px 22px}
  .summary-box h3{margin:0 0 12px; color:var(--accent); font-size:16px}
  .summary-box h3::before{content:"== conclusion =="; display:block; color:var(--muted); font-size:11px; margin-bottom:4px}
  .summary-box .q{font-size:14px; border-left:3px solid var(--accent); padding-left:12px; margin:8px 0; color:var(--text)}
  .summary-box .q.zh{border-left-color:var(--accent2); color:var(--zh)}
  .pri-list{margin-top:14px; display:flex; flex-direction:column; gap:8px}
  .pri{display:flex; gap:12px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:11px 14px}
  .pri .big{font-size:13px; font-weight:800; color:var(--accent-ink); background:var(--accent); width:24px; height:24px;
    border-radius:5px; display:grid; place-items:center; flex-shrink:0}
  .pri h4{margin:0 0 2px; font-size:13px; color:var(--accent2)}
  .pri p{margin:0; font-size:12.5px; color:var(--en)}

  /* —— Original：证据块全量 —— */
  .og-h{margin:24px 0 12px; padding:8px 14px; font-size:14px; font-weight:700; color:var(--accent);
    background:linear-gradient(90deg,var(--hl),transparent); border-left:3px solid var(--accent); border-radius:0 6px 6px 0}
  /* .og-h::before{content:"## "; color:var(--accent2)} */
  .og-h:first-child{margin-top:6px}

  /* —— Glossary：代码块词条 —— */
  #glossary{display:none}
  #glossary.show{display:block}
  .gloss-group{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:18px 0 10px; padding-bottom:7px; border-bottom:1px dashed var(--border)}
  .gloss-group .gg-desc{font-size:12.5px; color:var(--text)}
  .gloss-group .gg-count{display:inline-flex; align-items:center; margin-left:6px; padding:2px 9px; border:1px solid color-mix(in srgb,var(--accent2) 24%,var(--border)); border-radius:999px; background:color-mix(in srgb,var(--accent2) 10%,transparent); font-size:11px; font-weight:800; line-height:1.4; color:var(--muted)}
  .gloss-grid-inner{--gloss-card-min:240px; --gloss-card-max:340px; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--gloss-card-min)),var(--gloss-card-max))); justify-content:start; gap:10px; margin-bottom:6px}
  .gloss-item{width:100%; min-width:0; max-width:var(--gloss-card-max); background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:12px 14px}
  .gloss-item .grow{display:flex; align-items:center; gap:8px}
  .gloss-item .word,.gloss-item .gw{display:inline-block; font-weight:900; color:var(--accent); font-size:19px; line-height:1.08; letter-spacing:.06em; text-shadow:0 0 12px color-mix(in srgb,var(--accent) 28%,transparent)}
  .gloss-item .gw::before{content:"> "; color:var(--muted)}
  .gloss-item .gsub{display:flex; align-items:center; gap:8px; margin-top:3px}
  .gloss-item .gipa{color:var(--accent2); font-size:11px}
  .gloss-item .gpos{font-size:10px; background:var(--accent2); color:var(--accent2-ink); padding:0 6px; border-radius:4px; font-style:italic}
  .gloss-item .gdef{font-size:12.5px; color:var(--text); margin-top:5px}
  .gloss-item .geg{font-size:11.5px; color:var(--muted); font-style:italic; margin-top:4px}

  footer{text-align:center; color:var(--muted); font-size:11px; opacity:.6; padding:14px; border-top:1px dashed var(--border); margin-top:26px}
  footer a{color:var(--muted)}
  footer a:hover{color:var(--accent2)}

  .toc{position:fixed; right:14px; top:50%; transform:translateY(-50%); z-index:800;
    display:flex; flex-direction:column; align-items:center; gap:12px; padding:14px 10px; border-radius:10px;
    background:color-mix(in srgb,var(--panel) 82%,transparent); border:1px solid var(--border); backdrop-filter:blur(8px)}
  .toc a{width:10px; height:10px; border-radius:3px; background:var(--border); cursor:pointer; transition:.25s; position:relative; flex-shrink:0}
  .toc a:hover{background:var(--accent2); transform:scale(1.25)}
  .toc a.active{background:var(--accent); height:22px}
  .toc a span{position:absolute; right:20px; top:50%; transform:translateY(-50%) translateX(6px); white-space:nowrap;
    background:var(--panel); border:1px solid var(--accent); padding:3px 9px; border-radius:5px; font-size:11px;
    opacity:0; pointer-events:none; transition:.2s; color:var(--text)}
  .toc a:hover span{opacity:1; transform:translateY(-50%)}

  body.mode-original .summary-view{display:none}
  body.mode-original #originalSection{display:block}
  #originalSection{display:none}
  body.mode-original .toc,body.gloss-open .toc{display:none}
  body.gloss-open .hero,body.gloss-open .summary-view,body.gloss-open #originalSection{display:none!important}

  @media(max-width:760px){.toc{display:none}}

  .doc-title-link{display:block;flex:1;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}
  .doc-title-link:hover{color:var(--accent)}
  .reader-header .ctrls{margin-left:auto;justify-content:flex-end}
  .theme-group{display:inline-flex;align-items:center}
  .theme-btn{display:inline-flex;align-items:center;gap:6px}
  .theme-btn .ico{width:15px;height:15px;flex-shrink:0}

</style>
</head>
<body>
<div id="progress"></div>

<header class="reader-header">
  <a class="doc-title-link" href="__SOURCE_URL__" target="_blank" rel="noopener" aria-label="打开原文链接">__HEADER_TITLE__</a>
  <div class="ctrls" aria-label="阅读功能区">
    <div class="seg view-seg" role="group" aria-label="阅读视图">
      <button class="seg-btn active" type="button" data-mode="summary" onclick="setMode('summary',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg>精读</button>
      <button class="seg-btn" type="button" data-mode="original" onclick="setMode('original',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.8-1.2-4-1.8-6.5-1.8C4.7 4.2 4 4.9 4 5.7v11.6c0 .8.7 1.5 1.5 1.4C8 18.6 10.2 19.2 12 20.4"/><path d="M12 6c1.8-1.2 4-1.8 6.5-1.8.8 0 1.5.7 1.5 1.5v11.6c0 .8-.7 1.5-1.5 1.4-2.5-.1-4.7.5-6.5 1.7"/><path d="M12 6v14.4"/></svg>原文</button>
      <button class="seg-btn" type="button" id="glossBtn" data-mode="glossary" onclick="setMode('glossary',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H18a2 2 0 0 1 2 2v13.5"/><path d="M4 5.5v13A1.5 1.5 0 0 0 5.5 20H20"/><path d="M8 8.5h7M8 12h7"/></svg>词汇</button>
    </div>
    <div class="theme-group" role="group" aria-label="主题设置">
      <button class="btn theme-btn" type="button" id="themeBtn" onclick="switchTheme()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>主题</button>
    </div>
  </div>
</header>

<nav class="toc" id="toc"></nav>

<div class="wrap">
  <div class="hero" id="hero"></div>

  <section id="glossary">
    <h3 class="sec-title"><span class="num">vocab</span>核心词汇表</h3>
    <p class="note">全文重点词汇按 CEFR 分级，点 🔊 朗读。点击顶部「精读」或「原文」可切换回阅读视图。</p>
    <div id="glossGrid"></div>
  </section>

  <div id="contentHost"></div>

  <section id="originalSection">
    <h3 class="sec-title"><span class="num">raw</span><span id="ogTitle"></span></h3>
    <p class="note" id="ogMeta"></p>
    <div id="originalHost"></div>
  </section>
</div>

<footer id="footer"></footer>

<script>
window.BILINGUAL_READER_DATA = __DATA_JSON__;
window.BILINGUAL_READER_THEME = __THEME_JSON__;
const DATA = window.BILINGUAL_READER_DATA, THEME = window.BILINGUAL_READER_THEME;
</script>
<script>
__RUNTIME_JS__
</script>
<script>
/* ===== midnight-lab：实验记录 / 证据块的页面骨架与渲染 ===== */
const esc = BR.escapeHtml;

function renderHero(){
  const h=DATA.hero||{};
  document.getElementById('hero').innerHTML=
    `<div class="bar"><b>lab</b> · experiment log · ${esc(h.meta||'')}</div>`+
    `<div class="body"><h2>${esc(h.title)}</h2>`+
    (h.meta?`<div class="meta">${esc(h.meta)}</div>`:'')+
    `<div class="abstract">`+
      (h.en?`<p class="en">${esc(h.en)}</p>`:'')+
      (h.zh?`<p class="zh">${esc(h.zh)}</p>`:'')+
    `</div></div>`;
}

function sectionBlock(inner,toc,title,num){
  return `<section class="summary-view" data-toc="${esc(toc||'')}" data-title="${esc(title||toc||'')}">
      <h3 class="sec-title"><span class="num">${esc(num||'')}</span>${esc(title||'')}</h3>${inner}</section>`;
}

function renderContent(){
  const host=document.getElementById('contentHost');
  let html='';
  const s=DATA.summary||{};
  if(s.lead||s.cards){
    let inner=(s.lead?`<div class="sum-lead">${s.lead}</div>`:'')+
      `<div class="sum-grid">`+(s.cards||[]).map(c=>
        `<div class="sum-card"><span class="ico"></span><h4>${esc(c.title)}</h4><p>${esc(c.body)}</p></div>`).join('')+`</div>`;
    html+=sectionBlock(inner,'摘要','实验摘要','01');
  }
  (DATA.sections||[]).forEach(sec=>{
    let inner='';
    if(sec.type==='cards'){
      inner=(sec.note?`<p class="note">${esc(sec.note)}</p>`:'')+`<div class="cards" data-cards="1"></div>`;
    }else if(sec.type==='quiz'){
      inner=`<div class="quiz" data-quiz="1"></div>`;
    }else if(sec.type==='summary'){
      inner=summaryBoxHtml(sec.box||{});
    }else{
      inner=(sec.rows||[]).map((r,i)=>
        `<div class="evidence"><div class="ev-part src"><span class="ev-no">#${String(i+1).padStart(2,'0')}</span>${r.en}</div>`+
        `<div class="ev-part tr">${esc(r.zh)}</div></div>`).join('');
    }
    html+=sectionBlock(inner,sec.toc,sec.title,sec.num);
  });
  host.innerHTML=html;
  hydrateCards(); hydrateQuiz();
}

function summaryBoxHtml(box){
  const pri=(box.principles||[]).map(p=>
    `<div class="pri"><div class="big">${esc(p.big||'')}</div><div><h4>${esc(p.title||'')}</h4>`+
    `<p>${esc(p.en||'')} · <span style="color:var(--zh)">${esc(p.zh||'')}</span></p></div></div>`).join('');
  return `<div class="summary-box"><h3>${esc(box.heading||'一句话精髓')}</h3>`+
    (box.enQuote?`<div class="q">${esc(box.enQuote)}</div>`:'')+
    (box.zhQuote?`<div class="q zh">${esc(box.zhQuote)}</div>`:'')+
    (box.intro?`<p style="font-size:13px;color:var(--en);margin:10px 0 0">${esc(box.intro)}</p>`:'')+
    (pri?`<div class="pri-list">${pri}</div>`:'')+`</div>`;
}

function hydrateCards(){
  const sec=(DATA.sections||[]).find(s=>s.type==='cards');
  const host=document.querySelector('[data-cards]');
  if(!sec||!host)return;
  (sec.cards||[]).forEach(p=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<div class="top"><span class="tag">${esc(p.ico||'')}</span><div><h4>${esc(p.en)}</h4>`+
      (p.zh?`<div class="zhname">${esc(p.zh)}</div>`:'')+`</div></div>`+
      `<div class="body">${esc(p.body||'')}${p.when?`<div class="when">${esc(p.when)}</div>`:''}</div>`;
    host.appendChild(c);
  });
}

function hydrateQuiz(){
  const sec=(DATA.sections||[]).find(s=>s.type==='quiz');
  const qz=document.querySelector('[data-quiz]');
  if(!sec||!qz)return;
  const QUIZ=sec.quiz||[]; let qi=0,score=0;
  function render(){
    const item=QUIZ[qi];
    qz.innerHTML=`<div class="q-txt">Q${qi+1}. ${esc(item.q)}</div>`+
      item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')+
      `<div class="fb"></div><div class="quiz-nav"><small>case ${qi+1}/${QUIZ.length} · score ${score}</small><button class="btn" id="nextQ" style="display:none">next →</button></div>`;
    let answered=false;
    qz.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{
        if(answered)return; answered=true;
        const i=+b.dataset.i;
        if(i===item.a){b.classList.add('correct');score++;}
        else{b.classList.add('wrong');qz.querySelectorAll('.opt')[item.a].classList.add('correct');}
        qz.querySelector('.fb').textContent=item.fb||'';
        const nb=document.getElementById('nextQ');
        if(qi<QUIZ.length-1){nb.style.display='inline-block';nb.onclick=()=>{qi++;render();};}
        else{nb.style.display='inline-block';nb.textContent='rerun ↺';nb.onclick=()=>{qi=0;score=0;render();};
          qz.querySelector('.fb').textContent+=`  ✓ done. final ${score}/${QUIZ.length}`;}
      };
    });
  }
  render();
}

function renderOriginalRow(r){
  if(r.type==='image'){
    const cap=r.caption?`<figcaption>${esc(r.caption)}</figcaption>`:'';
    return `<figure class="og-media"><img src="${esc(r.src||'')}" alt="${esc(r.alt||'')}" width="720" height="405" loading="lazy" decoding="async" style="display:block;width:min(720px,100%);height:405px;object-fit:contain;margin:0 auto;">${cap}</figure>`;
  }
  return `<div class="evidence"><div class="ev-part src">${esc(r.en)}</div>`+
    `<div class="ev-part tr">${esc(r.zh)}</div></div>`;
}

function renderOriginal(){
  const o=DATA.original||{};
  document.getElementById('ogTitle').textContent=o.title||'原文全文对照';
  document.getElementById('ogMeta').textContent=o.meta||'';
  document.getElementById('originalHost').innerHTML=(o.groups||[]).map(g=>
    `<div class="og-h">${esc(g.group)}</div>`+
    (g.rows||[]).map(renderOriginalRow).join('')
  ).join('');
}

function renderGlossary(){
  const host=document.getElementById('glossGrid');
  const groups=BR.groupGlossary(); const links=[];
  host.innerHTML=groups.map(g=>{
    const gid='gloss-'+g.lvc;
    links.push({id:gid,label:g.level});
    const items=g.items.map(d=>
      `<div class="gloss-item"><div class="grow"><span class="gw">${esc(d.w)}</span>`+
      `<button class="speak" title="朗读" data-speak="${esc(d.w)}">🔊</button></div>`+
      `${(d.ipa || (d.pos && d.pos !== "术语")) ? `<div class="gsub">${d.ipa ? `<span class="gipa">${esc(d.ipa)}</span>` : ""}${d.pos && d.pos !== "术语" ? `<span class="gpos">${esc(d.pos)}</span>` : ""}</div>` : ""}`+
      `<div class="gdef">${esc(d.def)}</div><div class="geg">🗣 ${esc(d.eg||'')}</div></div>`).join('');
    return `<div class="gloss-group" id="${gid}" style="scroll-margin-top:75px"><span class="lv lv-${g.lvc}">${esc(g.level)}</span>`+
      `<span class="gg-desc">${esc(g.desc)}</span><span class="gg-count">${g.items.length} 词</span></div>`+
      `<div class="gloss-grid-inner">${items}</div>`;
  }).join('');
  host.querySelectorAll('[data-speak]').forEach(b=>b.addEventListener('click',e=>BR.speak(b.getAttribute('data-speak'),e)));
  return links;
}

function renderFooter(){
  const f=DATA.footer||{};
  document.getElementById('footer').innerHTML=f.sourceUrl?
    `原文：<a href="${esc(f.sourceUrl)}" target="_blank" rel="noopener">《${esc(f.sourceText||f.sourceUrl)}》</a>`:esc(f.sourceText||'');
}

/* ===== 控制 ===== */
function scrollToActiveFirstAnchor(behavior='auto'){
  const target=document.querySelector('section[data-toc]');
  if(target)requestAnimationFrame(()=>target.scrollIntoView({behavior,block:'start'}));
}
function scrollToGlossaryTop(behavior='auto'){
  const target=document.getElementById('glossary');
  if(target)requestAnimationFrame(()=>target.scrollIntoView({behavior,block:'start'}));
}
function setMode(m,btn){
  const glossary=document.getElementById('glossary');
  document.body.classList.toggle('mode-original',m==='original');
  document.body.classList.toggle('gloss-open',m==='glossary');
  if(glossary)glossary.classList.toggle('show',m==='glossary');
  document.querySelectorAll('.view-seg .seg-btn[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  if(m==='glossary')scrollToGlossaryTop('smooth');
  else scrollToActiveFirstAnchor('smooth');
}
function switchTheme(){
  const mode=BR.toggleTheme();
  const moon='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>';
  const sun='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  document.getElementById('themeBtn').innerHTML=(mode==='light'?sun:moon)+'主题';
}
const glossBtn=document.getElementById("glossBtn");
function openGloss(){setMode('glossary',glossBtn);}
function closeGloss(){
  const cur=document.body.classList.contains('mode-original')?'original':'summary';
  const target=document.querySelector(`.view-seg .seg-btn[data-mode="${cur}"]`);
  if(target)setMode(cur,target);
}
function toggleGloss(){setMode('glossary',glossBtn);}

/* ===== 初始化 ===== */
renderHero(); renderContent(); renderOriginal(); renderGlossary(); renderFooter();
BR.autowrap(document.querySelectorAll('#originalSection .ev-part.src'));
BR.mountTooltips(document);

const toc=document.getElementById("toc");
let secList=document.querySelectorAll("section[data-toc]");
let tocLinks=[];
secList.forEach((s,i)=>{s.id="sec"+i; s.style.scrollMarginTop="75px";});
tocLinks=renderToc(sectionAnchors());
BR.initProgress((pct,sc,max)=>{
  if(document.body.classList.contains("gloss-open")){
    let gc=0;
    const groups=document.querySelectorAll(".gloss-group");
    groups.forEach((g,i)=>{if(g.getBoundingClientRect().top<160)gc=i;});
    if(max<=0||sc>=max-2){gc=groups.length-1;}
    tocLinks.forEach((a,i)=>a.classList.toggle("active",i===gc));
    return;
  }
  let cur=0; secList.forEach((s,i)=>{if(s.getBoundingClientRect().top<160)cur=i;});
  if(max<=0||sc>=max-2){cur=secList.length-1;}
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
});
scrollToActiveFirstAnchor();
</script>
