<!-- bilingual-reader-template
name: card-atlas
style: source-derived article atlas, anchored reading workspace, numbered bilingual cards
-->
<style>
  body{
    background:
      linear-gradient(90deg,color-mix(in srgb,var(--accent) 12%,transparent),transparent 28%),
      radial-gradient(circle at 88% 12%,color-mix(in srgb,var(--accent2) 18%,transparent),transparent 34%),
      var(--bg);
  }
  body.template-card-atlas-v2::before{
    content:none;
  }
  header{
    position:sticky;top:12px;margin:12px auto 0;width:min(1180px,calc(100% - 32px));
    border:1px solid color-mix(in srgb,var(--accent) 28%,var(--border));
    border-radius:18px;padding:12px 18px;box-shadow:0 16px 46px rgba(0,0,0,.24);
  }
  header h1{font-size:15px;letter-spacing:.01em}
  .ctrls{gap:10px}.group{gap:6px}.seg-btn,.btn{padding:6px 11px}
  .wrap{
    max-width:1240px;padding:26px 28px 76px;
    display:grid;grid-template-columns:minmax(280px,.42fr) minmax(0,1fr);
    gap:22px;align-items:start;
  }
  .hero{
    position:sticky;top:92px;grid-column:1;border-radius:26px;padding:24px;
    background:
      linear-gradient(160deg,color-mix(in srgb,var(--accent) 18%,var(--panel)),var(--panel2));
    border:1px solid color-mix(in srgb,var(--accent) 38%,var(--border));
    box-shadow:0 22px 60px rgba(0,0,0,.22);
  }
  .hero::before{
    content:"Article Atlas";display:inline-flex;margin-bottom:16px;padding:4px 10px;
    border:1px solid color-mix(in srgb,var(--accent2) 42%,var(--border));
    border-radius:999px;color:var(--accent2);font-size:11px;font-weight:800;
    letter-spacing:.12em;text-transform:uppercase;
  }
  .hero h2{font-size:30px;line-height:1.08;margin-bottom:12px;letter-spacing:-.045em}
  .hero .meta{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .hero p{font-size:14px}.hero .zh{border-top:1px dashed var(--border);padding-top:10px;margin-top:10px}
  #glossary,.summary-view,.reader-section,#sectionsHost,#originalSection{grid-column:2;min-width:0}
  section.summary-view{
    background:color-mix(in srgb,var(--panel) 84%,transparent);
    border:1px solid var(--border);border-radius:24px;padding:22px;margin-bottom:18px;
    box-shadow:0 16px 44px rgba(0,0,0,.14);
  }
  .sec-title{
    border:0;margin-bottom:18px;padding-bottom:0;font-size:18px;
    display:grid;grid-template-columns:auto 1fr;align-items:center;
  }
  .sec-title::after{content:"";height:1px;background:linear-gradient(90deg,var(--border),transparent)}
  .sec-title .num{border-radius:14px;background:var(--panel2);color:var(--accent);border:1px solid var(--accent)}
  .sum-lead{
    border:0;border-radius:18px;background:linear-gradient(135deg,var(--panel2),var(--panel));
    padding:18px 20px;margin-bottom:14px;
  }
  .sum-grid,.cards,.principles,.gloss-grid-inner{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .sum-card,.card,.pri,.gloss-item,.quiz,.summary-box{
    border-radius:20px;border-color:color-mix(in srgb,var(--accent) 20%,var(--border));
    box-shadow:0 12px 34px rgba(0,0,0,.12);
  }
  #glossary .gloss-group{
    display:block;margin:32px 0 22px;padding:0 0 14px;
    border-bottom:1px solid color-mix(in srgb,var(--accent) 24%,var(--border));
  }
  #glossary .gloss-group h4{
    display:block;margin:0 0 20px;color:var(--accent);font-size:18px;line-height:1.3;
    letter-spacing:-.01em;
  }
  #glossary .gloss-group h4 span{display:inline;margin-left:8px;color:var(--muted);font-size:13px;font-weight:600;}
  #glossary .gloss-grid-inner{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:0 0 18px;
  }
  #glossary .gloss-item{
    position:relative;overflow:hidden;padding:18px 18px 16px;
    background:
      linear-gradient(150deg,color-mix(in srgb,var(--accent) 10%,transparent),transparent 34%),
      color-mix(in srgb,var(--panel) 92%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 26%,var(--border));
    border-radius:20px;box-shadow:0 14px 36px rgba(0,0,0,.14);
  }
  #glossary .gloss-item::before{
    content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent);opacity:.82;
  }
  #glossary .gloss-item .h{display:flex;align-items:center;gap:8px}
  #glossary .gloss-item .word{display:inline-block;font-weight:900;color:var(--accent);font-size:23px;line-height:1.05;letter-spacing:.05em;text-shadow:0 0 14px color-mix(in srgb,var(--accent) 28%,transparent)}
  #glossary .gloss-item .sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
  #glossary .gloss-item .ipa{color:var(--accent2);font-size:13px;font-family:Georgia,serif}
  #glossary .gloss-item .pos{
    font-size:10px;background:var(--accent2);color:var(--accent2-ink);
    padding:1px 7px;border-radius:6px;font-style:italic;
  }
  #glossary .gloss-item .def{margin:10px 0 0;color:var(--text);font-size:13px;line-height:1.65}
  #glossary .gloss-item .eg{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.55;font-style:italic}
  #glossary .gloss-item .egzh{display:block;margin-top:3px;color:var(--muted);font-style:normal}
  .sum-card:hover,.card:hover,.pri:hover{transform:translateY(-2px)}
  .row{
    grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:12px;border:0;
    background:transparent;margin:0 0 14px;padding-left:42px;position:relative;
  }
  .row::before{
    content:attr(data-atlas-index);position:absolute;left:0;top:0;width:30px;height:30px;
    display:grid;place-items:center;border-radius:10px;background:var(--accent);
    color:var(--accent-ink);font-size:11px;font-weight:900;
  }
  .cell{
    border:1px solid var(--border);border-radius:18px!important;background:var(--panel);
    min-height:112px;padding:32px 18px 16px;position:relative;box-shadow:0 10px 28px rgba(0,0,0,.10);
  }
  .cell::before{
    position:absolute;top:10px;left:16px;font-size:10px;font-weight:900;letter-spacing:.12em;
    color:var(--muted);text-transform:uppercase;
  }
  .cell.en{border-right:1px solid var(--border);font-size:15px;line-height:1.72}
  .cell.en::before{content:"English"}
  .cell.zh{background:linear-gradient(180deg,var(--panel2),color-mix(in srgb,var(--panel2) 78%,var(--accent) 8%));font-size:15px;line-height:1.78}
  .cell.zh::before{content:"中文译读"}
  .toc{
    left:auto;right:18px;top:50%;bottom:auto;transform:translateY(-50%);border-radius:18px;
    max-height:44vh;overflow:auto;
  }
  body.mode-original .wrap{
    display:block;max-width:1060px;padding-top:22px;
  }
  body.mode-original .hero{
    position:relative;top:auto;display:block;padding:16px 20px;margin-bottom:18px;
    border-radius:18px;box-shadow:0 12px 34px rgba(0,0,0,.14);
  }
  body.mode-original .hero::before{
    margin-bottom:8px;font-size:10px;
  }
  body.mode-original .hero h2{
    font-size:22px;line-height:1.18;margin-bottom:6px;letter-spacing:-.025em;
  }
  body.mode-original .hero p{
    display:none;
  }
  body.mode-original .hero .meta{
    display:block;margin-bottom:0;font-size:11px;
  }
  body.mode-original #originalSection{
    min-width:0;
  }
  body.mode-original #originalSection .row{
    grid-template-columns:1fr 1fr;padding-left:0;
  }
  body.mode-original #originalSection .row::before{
    content:none;
  }
  body.gloss-open .wrap{
    display:block;max-width:1180px;padding-top:22px;
  }
  body.gloss-open #glossary{
    width:100%;min-width:0;
  }
  .tip{z-index:2147483647}
  @media(max-width:980px){
    header{top:0;margin:0;width:100%;border-radius:0}
    .wrap{display:block;padding:18px 16px 64px}
    .hero{position:relative;top:auto;margin-bottom:18px}
    .row{padding-left:0;grid-template-columns:1fr}.row::before{position:relative;margin-bottom:8px}
    .toc{display:none}
  }

  .doc-title-link{display:block;flex:1;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}
  .doc-title-link:hover{color:var(--accent)}
  .reader-header .ctrls{margin-left:auto;justify-content:flex-end}
  .theme-group{display:inline-flex;align-items:center}
  .theme-btn{display:inline-flex;align-items:center;gap:6px}
  .theme-btn .ico{width:15px;height:15px;flex-shrink:0}

</style>
<script>
  document.addEventListener('DOMContentLoaded',()=>{
    document.body.classList.add('template-card-atlas-v2');
    document.querySelectorAll('.row').forEach((row,index)=>{
      row.dataset.atlasIndex=String(index+1).padStart(2,'0');
    });
  });
</script>
