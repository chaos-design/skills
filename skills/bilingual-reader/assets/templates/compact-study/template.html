<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__PAGE_TITLE__</title>
<!-- bilingual-reader-template
name: compact-study
style: 独立整页模板 · 高密度学习表 / dense study sheet
structure: 单列窄边距 + 编号双列表格行 + 紧凑标签卡 + 横向 principles 条带
-->
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --border:#2a3340;
    --text:#e6edf3; --muted:#9aa7b4; --en:#cdd9e5; --zh:#e8d9b8;
    --accent:#f5a623; --accent2:#58a6ff; --green:#3fb950; --tip-bg:#0b1622;
    --accent-ink:#1a1205; --accent2-ink:#031018; --accent-shadow:rgba(245,166,35,.35);
    --hl:rgba(245,166,35,.16);
    --radius:10px; --radius-lg:12px; --radius-sm:7px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --hero-angle:135deg;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:14.5px; line-height:1.65; transition:background .3s,color .3s}
  __RUNTIME_CSS__

  /* —— 顶栏：固定、极简图标化 —— */
  header{position:sticky; top:0; z-index:900; backdrop-filter:blur(10px);
    background:color-mix(in srgb,var(--bg) 84%,transparent);
    border-bottom:1px solid var(--border); padding:7px 14px;
    display:flex; align-items:center; gap:10px}
  header h1{font-size:13px; margin:0; flex:1; min-width:140px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  header h1 span{color:var(--accent)}
  .ctrls{display:flex; gap:8px; align-items:center}
  .seg{display:inline-flex; align-items:center; background:var(--panel2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:2px; gap:2px}
  .seg-btn{display:inline-flex; align-items:center; gap:5px; background:transparent; color:var(--muted);
    border:none; cursor:pointer; height:32px; min-width:64px; justify-content:center; padding:0 10px; border-radius:6px; font-size:12px; transition:.2s; white-space:nowrap}
  .seg-btn .ico{width:14px; height:14px; flex-shrink:0}
  .seg-btn:hover{color:var(--accent)}
  .seg-btn.active{background:var(--accent); color:var(--accent-ink); font-weight:700}

  .wrap{max-width:1180px; margin:0 auto; padding:22px 26px 72px}

  /* —— Hero：压缩横幅 —— */
  .hero{display:grid; grid-template-columns:1fr; gap:8px;
    background:linear-gradient(var(--hero-angle),var(--panel),var(--panel2));
    border:1px solid var(--border); border-left:4px solid var(--accent);
    border-radius:var(--radius); padding:20px 24px; margin-bottom:22px}
  .hero h2{margin:0; font-size:23px; line-height:1.3}
  .hero .meta{color:var(--muted); font-size:12.5px}
  .hero .en{color:var(--en); margin:4px 0 0; font-size:14.5px}
  .hero .zh{color:var(--zh); margin:0; font-size:14.5px}

  .block{margin-bottom:28px}
  .sec-title{display:flex; align-items:center; gap:10px; font-size:18px; font-weight:700;
    margin:0 0 14px; padding-bottom:9px; border-bottom:2px solid var(--border)}
  .sec-title .num{background:var(--accent); color:var(--accent-ink); min-width:24px; height:24px; padding:0 6px;
    border-radius:7px; display:grid; place-items:center; font-size:12.5px; font-weight:800}
  .note{color:var(--muted); font-size:13px; margin:-4px 0 12px}

  /* —— Summary：一行摘要 + 两列紧凑卡 —— */
  .sum-lead{background:color-mix(in srgb,var(--accent) 9%,var(--panel));
    border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px; font-size:14px; margin-bottom:14px}
  .sum-lead b{color:var(--accent)}
  .sum-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
  .sum-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px}
  .sum-card .ico{font-size:14px; font-weight:800; color:var(--accent2); margin-bottom:5px}
  .sum-card h4{margin:0 0 5px; font-size:14.5px; color:var(--accent)}
  .sum-card p{margin:0; font-size:13px; color:var(--en); line-height:1.6}

  /* —— Sections rows：编号双列表格行（中英左右对照） —— */
  .study-table{border:1px solid var(--border); border-radius:var(--radius); overflow:hidden}
  .study-row{display:grid; grid-template-columns:40px 1fr 1fr; align-items:stretch;
    border-bottom:1px solid var(--border)}
  .study-row:last-child{border-bottom:none}
  .study-row:hover{background:var(--hl)}
  .study-row .no{display:grid; place-items:center; font-size:12px; font-weight:800; color:var(--accent-ink);
    background:var(--accent); writing-mode:initial}
  .study-row .en{padding:14px 16px; color:var(--en); font-size:14px; line-height:1.65; border-right:1px solid var(--border)}
  .study-row .zh{padding:14px 16px; color:var(--zh); font-size:14px; line-height:1.65; background:color-mix(in srgb,var(--panel2) 70%,transparent)}

  /* —— Cards 模块：紧凑标签卡 —— */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; transition:.2s}
  .card:hover{border-color:var(--accent)}
  .card .top{display:flex; align-items:center; gap:10px}
  .card .tag{width:24px; height:24px; border-radius:7px; background:var(--accent2); color:var(--accent2-ink);
    display:grid; place-items:center; font-size:12px; font-weight:800; flex-shrink:0}
  .card h4{margin:0; font-size:14.5px; color:var(--accent)}
  .card .zhname{font-size:12.5px; color:var(--muted)}
  .card .body{font-size:13px; color:var(--en); line-height:1.6; margin-top:8px}
  .card .when{margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); color:var(--zh)}

  /* —— Quiz —— */
  .quiz{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px}
  .quiz .q-txt{font-size:15px; font-weight:600; margin-bottom:12px}
  .quiz .opt{display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--border);
    border-radius:8px; padding:10px 14px; margin-bottom:8px; cursor:pointer; color:var(--text); font-size:13.5px; transition:.15s}
  .quiz .opt:hover{border-color:var(--accent2)}
  .quiz .opt.correct{background:rgba(63,185,80,.2); border-color:var(--green)}
  .quiz .opt.wrong{background:rgba(248,81,73,.2); border-color:#f85149}
  .quiz .fb{margin-top:8px; font-size:13px; color:var(--muted); min-height:18px}
  .quiz-nav{display:flex; justify-content:space-between; align-items:center; margin-top:10px}
  .quiz-nav small{color:var(--muted); font-size:12px}
  .btn{background:var(--panel2); color:var(--text); border:1px solid var(--border); padding:7px 14px;
    border-radius:7px; cursor:pointer; font-size:13px}
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  header .btn{height:32px; min-width:64px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--radius-sm)}

  /* —— Summary box：横向 principles 条带 —— */
  .summary-box{background:linear-gradient(var(--hero-angle),var(--panel),var(--panel2));
    border:1px solid var(--accent); border-radius:var(--radius-lg); padding:18px 20px}
  .summary-box h3{margin:0 0 12px; color:var(--accent); font-size:17px}
  .summary-box .q{font-size:14px; font-style:italic; border-left:3px solid var(--accent); padding-left:12px; margin:8px 0; color:var(--text); line-height:1.6}
  .summary-box .q.zh{border-left-color:var(--accent2); color:var(--zh); font-style:normal}
  .pri-strip{display:flex; flex-wrap:wrap; gap:12px; margin-top:14px}
  .pri{flex:1 1 180px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px}
  .pri .big{font-size:18px; font-weight:800; color:var(--accent)}
  .pri h4{margin:4px 0; font-size:14px; color:var(--accent2)}
  .pri p{margin:0; font-size:12.5px; color:var(--en); line-height:1.55}

  /* —— Original：分组逐段双列对照 —— */
  .og-h{margin:20px 0 10px; padding:8px 14px; font-size:14px; font-weight:800; color:var(--accent);
    background:linear-gradient(90deg,var(--hl),transparent); border-left:3px solid var(--accent); border-radius:0 6px 6px 0}
  .og-row{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--border); border-radius:var(--radius);
    margin-bottom:10px; overflow:hidden}
  .og-row .en{padding:13px 16px; color:var(--en); font-size:13.5px; line-height:1.65; border-right:1px solid var(--border)}
  .og-row .zh{padding:13px 16px; color:var(--zh); font-size:13.5px; line-height:1.65; background:color-mix(in srgb,var(--panel2) 70%,transparent)}

  /* —— Glossary：CEFR 分组 + 多列密集 —— */
  #glossary{display:none}
  #glossary.show{display:block}
  .gloss-group{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:20px 0 10px; padding-bottom:8px; border-bottom:1px dashed var(--border)}
  .gloss-group .gg-desc{font-size:13.5px; color:var(--text); font-weight:600}
  .gloss-group .gg-count{display:inline-flex; align-items:center; margin-left:6px; padding:2px 9px; border:1px solid color-mix(in srgb,var(--accent2) 24%,var(--border)); border-radius:999px; background:color-mix(in srgb,var(--accent2) 10%,transparent); font-size:12px; font-weight:800; line-height:1.4; color:var(--muted)}
  .gloss-grid-inner{--gloss-card-min:240px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--gloss-card-min)),1fr)); grid-auto-rows:1fr; align-items:stretch; gap:12px; margin-bottom:10px}
  .gloss-item{width:100%; height:100%; min-width:0; display:flex; flex-direction:column; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px}
  .gloss-item .grow{display:flex; align-items:center; gap:8px}
  .gloss-item .word,.gloss-item .gw{display:inline-block; font-weight:900; color:var(--accent); font-size:20px; line-height:1.08; letter-spacing:.05em; text-shadow:0 0 12px color-mix(in srgb,var(--accent) 24%,transparent)}
  .gloss-item .gsub{display:flex; align-items:center; gap:8px; margin-top:4px}
  .gloss-item .gipa{color:var(--accent2); font-size:12.5px; font-family:Georgia,serif}
  .gloss-item .gpos{font-size:11px; background:var(--accent2); color:var(--accent2-ink); padding:1px 7px; border-radius:5px; font-style:italic}
  .gloss-item .gdef{font-size:13.5px; color:var(--text); margin-top:8px; line-height:1.6}
  .gloss-item .geg{font-size:12.5px; color:var(--en); font-style:italic; margin-top:6px; line-height:1.55}
  .gloss-item .geg .egzh{display:block; color:var(--muted); font-style:normal; margin-top:3px}

  footer{text-align:center; color:var(--muted); font-size:11px; opacity:.6; padding:12px; border-top:1px solid var(--border); margin-top:22px}
  footer a{color:var(--muted)}
  footer a:hover{color:var(--accent2)}

  /* —— TOC：右侧紧凑圆点 —— */
  .toc{position:fixed; right:10px; top:50%; transform:translateY(-50%); z-index:800;
    display:flex; flex-direction:column; align-items:center; gap:9px; padding:10px 8px; border-radius:22px;
    background:color-mix(in srgb,var(--panel) 78%,transparent); border:1px solid var(--border); backdrop-filter:blur(8px)}
  .toc a{width:9px; height:9px; border-radius:50%; background:var(--border); cursor:pointer; transition:.25s; position:relative; flex-shrink:0}
  .toc a:hover{background:var(--accent2); transform:scale(1.3)}
  .toc a.active{background:var(--accent); height:20px; border-radius:6px}
  .toc a span{position:absolute; right:18px; top:50%; transform:translateY(-50%) translateX(6px); white-space:nowrap;
    background:var(--panel); border:1px solid var(--accent); padding:3px 9px; border-radius:6px; font-size:11px;
    opacity:0; pointer-events:none; transition:.2s; color:var(--text)}
  .toc a:hover span{opacity:1; transform:translateY(-50%)}

  body.mode-original .summary-view{display:none}
  body.mode-original #originalSection{display:block}
  #originalSection{display:none}
  body.mode-original .toc,body.gloss-open .toc{display:none}
  body.gloss-open .hero,body.gloss-open .summary-view,body.gloss-open #originalSection{display:none!important}

  @media(max-width:760px){
    .toc{display:none}
    .study-row{grid-template-columns:28px 1fr}
    .study-row .zh{grid-column:1 / -1; border-top:1px solid var(--border)}
    .study-row .en{border-right:none}
    .og-row{grid-template-columns:1fr}
    .og-row .en{border-right:none; border-bottom:1px solid var(--border)}
  }

  .doc-title-link{display:block;flex:1;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}
  .doc-title-link:hover{color:var(--accent)}
  .reader-header .ctrls{margin-left:auto;justify-content:flex-end}
  .theme-group{display:inline-flex;align-items:center}
  .theme-btn{display:inline-flex;align-items:center;gap:6px}
  .theme-btn .ico{width:15px;height:15px;flex-shrink:0}

</style>
</head>
<body>
<div id="progress"></div>

<header class="reader-header">
  <a class="doc-title-link" href="__SOURCE_URL__" target="_blank" rel="noopener" aria-label="打开原文链接">__HEADER_TITLE__</a>
  <div class="ctrls" aria-label="阅读功能区">
    <div class="seg view-seg" role="group" aria-label="阅读视图">
      <button class="seg-btn active" type="button" data-mode="summary" onclick="setMode('summary',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg>精读</button>
      <button class="seg-btn" type="button" data-mode="original" onclick="setMode('original',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.8-1.2-4-1.8-6.5-1.8C4.7 4.2 4 4.9 4 5.7v11.6c0 .8.7 1.5 1.5 1.4C8 18.6 10.2 19.2 12 20.4"/><path d="M12 6c1.8-1.2 4-1.8 6.5-1.8.8 0 1.5.7 1.5 1.5v11.6c0 .8-.7 1.5-1.5 1.4-2.5-.1-4.7.5-6.5 1.7"/><path d="M12 6v14.4"/></svg>原文</button>
      <button class="seg-btn" type="button" id="glossBtn" data-mode="glossary" onclick="setMode('glossary',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H18a2 2 0 0 1 2 2v13.5"/><path d="M4 5.5v13A1.5 1.5 0 0 0 5.5 20H20"/><path d="M8 8.5h7M8 12h7"/></svg>词汇</button>
    </div>
    <div class="theme-group" role="group" aria-label="主题设置">
      <button class="btn theme-btn" type="button" id="themeBtn" onclick="switchTheme()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>主题</button>
    </div>
  </div>
</header>

<nav class="toc" id="toc"></nav>

<div class="wrap">
  <div class="hero" id="hero"></div>

  <section id="glossary">
    <h3 class="sec-title"><span class="num">📖</span>核心词汇表</h3>
    <p class="note">全文重点词汇按 CEFR 分级，点 🔊 朗读。点击顶部「精读」或「原文」可切换回阅读视图。</p>
    <div id="glossGrid"></div>
  </section>

  <div id="contentHost"></div>

  <section id="originalSection">
    <h3 class="sec-title"><span class="num">📖</span><span id="ogTitle"></span></h3>
    <p class="note" id="ogMeta"></p>
    <div id="originalHost"></div>
  </section>
</div>

<footer id="footer"></footer>

<script>
window.BILINGUAL_READER_DATA = __DATA_JSON__;
window.BILINGUAL_READER_THEME = __THEME_JSON__;
const DATA = window.BILINGUAL_READER_DATA, THEME = window.BILINGUAL_READER_THEME;
</script>
<script>
__RUNTIME_JS__
</script>
<script>
/* ===== compact-study：高密度学习表的页面骨架与渲染 ===== */
const esc = BR.escapeHtml;

function renderHero(){
  const h=DATA.hero||{};
  document.getElementById('hero').innerHTML=
    `<h2>${esc(h.title)}</h2>`+
    (h.meta?`<div class="meta">${esc(h.meta)}</div>`:'')+
    (h.en?`<p class="en">${esc(h.en)}</p>`:'')+
    (h.zh?`<p class="zh">${esc(h.zh)}</p>`:'');
}

function sectionBlock(inner,toc,title,num){
  return `<section class="summary-view block" data-toc="${esc(toc||'')}" data-title="${esc(title||toc||'')}">
      <h3 class="sec-title"><span class="num">${esc(num||'')}</span>${esc(title||'')}</h3>${inner}</section>`;
}

function renderContent(){
  const host=document.getElementById('contentHost');
  let html='';
  // Summary 速览
  const s=DATA.summary||{};
  if(s.lead||s.cards){
    let inner=(s.lead?`<div class="sum-lead">${s.lead}</div>`:'')+
      `<div class="sum-grid">`+(s.cards||[]).map(c=>
        `<div class="sum-card"><div class="ico">${esc(c.icon||'')}</div><h4>${esc(c.title)}</h4><p>${esc(c.body)}</p></div>`).join('')+`</div>`;
    html+=sectionBlock(inner,'速览','全文速览','✨');
  }
  // Sections
  (DATA.sections||[]).forEach(sec=>{
    let inner='';
    if(sec.type==='cards'){
      inner=(sec.note?`<p class="note">${esc(sec.note)}</p>`:'')+`<div class="cards" data-cards="1"></div>`;
    }else if(sec.type==='quiz'){
      inner=`<div class="quiz" data-quiz="1"></div>`;
    }else if(sec.type==='summary'){
      inner=summaryBoxHtml(sec.box||{});
    }else{
      inner=`<div class="study-table">`+(sec.rows||[]).map((r,i)=>
        `<div class="study-row"><div class="no">${String(i+1).padStart(2,'0')}</div>`+
        `<div class="en">${r.en}</div><div class="zh">${esc(r.zh)}</div></div>`).join('')+`</div>`;
    }
    html+=sectionBlock(inner,sec.toc,sec.title,sec.num);
  });
  host.innerHTML=html;
  hydrateCards(); hydrateQuiz();
}

function summaryBoxHtml(box){
  const pri=(box.principles||[]).map(p=>
    `<div class="pri"><div class="big">${esc(p.big||'')}</div><h4>${esc(p.title||'')}</h4>`+
    `<p>${esc(p.en||'')}<br><span style="color:var(--zh)">${esc(p.zh||'')}</span></p></div>`).join('');
  return `<div class="summary-box"><h3>${esc(box.heading||'一句话精髓')}</h3>`+
    (box.enQuote?`<div class="q">${esc(box.enQuote)}</div>`:'')+
    (box.zhQuote?`<div class="q zh">${esc(box.zhQuote)}</div>`:'')+
    (box.intro?`<p style="font-size:12.5px;color:var(--en);margin:8px 0 0">${esc(box.intro)}</p>`:'')+
    (pri?`<div class="pri-strip">${pri}</div>`:'')+`</div>`;
}

function hydrateCards(){
  const sec=(DATA.sections||[]).find(s=>s.type==='cards');
  const host=document.querySelector('[data-cards]');
  if(!sec||!host)return;
  (sec.cards||[]).forEach(p=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<div class="top"><span class="tag">${esc(p.ico||'')}</span><div><h4>${esc(p.en)}</h4>`+
      (p.zh?`<div class="zhname">${esc(p.zh)}</div>`:'')+`</div></div>`+
      `<div class="body">${esc(p.body||'')}${p.when?`<div class="when">${esc(p.when)}</div>`:''}</div>`;
    host.appendChild(c);
  });
}

function hydrateQuiz(){
  const sec=(DATA.sections||[]).find(s=>s.type==='quiz');
  const qz=document.querySelector('[data-quiz]');
  if(!sec||!qz)return;
  const QUIZ=sec.quiz||[]; let qi=0,score=0;
  function render(){
    const item=QUIZ[qi];
    qz.innerHTML=`<div class="q-txt">Q${qi+1}. ${esc(item.q)}</div>`+
      item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')+
      `<div class="fb"></div><div class="quiz-nav"><small>第 ${qi+1}/${QUIZ.length} 题 · 得分 ${score}</small><button class="btn" id="nextQ" style="display:none">下一题 →</button></div>`;
    let answered=false;
    qz.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{
        if(answered)return; answered=true;
        const i=+b.dataset.i;
        if(i===item.a){b.classList.add('correct');score++;}
        else{b.classList.add('wrong');qz.querySelectorAll('.opt')[item.a].classList.add('correct');}
        qz.querySelector('.fb').textContent=item.fb||'';
        const nb=document.getElementById('nextQ');
        if(qi<QUIZ.length-1){nb.style.display='inline-block';nb.onclick=()=>{qi++;render();};}
        else{nb.style.display='inline-block';nb.textContent='重新测验 ↺';nb.onclick=()=>{qi=0;score=0;render();};
          qz.querySelector('.fb').textContent+=`  🎉 完成！最终得分 ${score}/${QUIZ.length}`;}
      };
    });
  }
  render();
}

function renderOriginalRow(r){
  if(r.type==='image'){
    const cap=r.caption?`<figcaption>${esc(r.caption)}</figcaption>`:'';
    return `<figure class="og-media"><img src="${esc(r.src||'')}" alt="${esc(r.alt||'')}" width="720" height="405" loading="lazy" decoding="async" style="display:block;width:min(720px,100%);height:405px;object-fit:contain;margin:0 auto;">${cap}</figure>`;
  }
  return `<div class="og-row"><div class="en">${esc(r.en)}</div><div class="zh">${esc(r.zh)}</div></div>`;
}

function renderOriginal(){
  const o=DATA.original||{};
  document.getElementById('ogTitle').textContent=o.title||'原文全文对照';
  document.getElementById('ogMeta').textContent=o.meta||'';
  document.getElementById('originalHost').innerHTML=(o.groups||[]).map(g=>
    `<div class="og-h">${esc(g.group)}</div>`+
    (g.rows||[]).map(renderOriginalRow).join('')
  ).join('');
}

function renderGlossary(){
  const host=document.getElementById('glossGrid');
  const groups=BR.groupGlossary(); const links=[];
  host.innerHTML=groups.map(g=>{
    const gid='gloss-'+g.lvc;
    links.push({id:gid,label:g.level});
    const items=g.items.map(d=>
      `<div class="gloss-item"><div class="grow"><span class="gw">${esc(d.w)}</span>`+
      `<button class="speak" title="朗读" data-speak="${esc(d.w)}">🔊</button></div>`+
      `${(d.ipa || (d.pos && d.pos !== "术语")) ? `<div class="gsub">${d.ipa ? `<span class="gipa">${esc(d.ipa)}</span>` : ""}${d.pos && d.pos !== "术语" ? `<span class="gpos">${esc(d.pos)}</span>` : ""}</div>` : ""}`+
      `<div class="gdef">${esc(d.def)}</div><div class="geg">🗣 ${esc(d.eg||'')}`+
      `${d.egzh?`<span class="egzh">${esc(d.egzh)}</span>`:''}</div></div>`).join('');
    return `<div class="gloss-group" id="${gid}" style="scroll-margin-top:70px"><span class="lv lv-${g.lvc}">${esc(g.level)}</span>`+
      `<span class="gg-desc">${esc(g.desc)}</span><span class="gg-count">${g.items.length} 词</span></div>`+
      `<div class="gloss-grid-inner">${items}</div>`;
  }).join('');
  host.querySelectorAll('[data-speak]').forEach(b=>b.addEventListener('click',e=>BR.speak(b.getAttribute('data-speak'),e)));
  return links;
}

function renderFooter(){
  const f=DATA.footer||{};
  document.getElementById('footer').innerHTML=f.sourceUrl?
    `原文：<a href="${esc(f.sourceUrl)}" target="_blank" rel="noopener">《${esc(f.sourceText||f.sourceUrl)}》</a>`:esc(f.sourceText||'');
}

/* ===== 控制：视图 / 主题 / 词汇表 ===== */
function scrollToActiveFirstAnchor(behavior='auto'){
  const target=document.querySelector('section[data-toc]');
  if(target)requestAnimationFrame(()=>target.scrollIntoView({behavior,block:'start'}));
}
function scrollToGlossaryTop(behavior='auto'){
  const target=document.getElementById('glossary');
  if(target)requestAnimationFrame(()=>target.scrollIntoView({behavior,block:'start'}));
}
function setMode(m,btn){
  const glossary=document.getElementById('glossary');
  document.body.classList.toggle('mode-original',m==='original');
  document.body.classList.toggle('gloss-open',m==='glossary');
  if(glossary)glossary.classList.toggle('show',m==='glossary');
  document.querySelectorAll('.view-seg .seg-btn[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  if(m==='glossary')scrollToGlossaryTop('smooth');
  else scrollToActiveFirstAnchor('smooth');
}
function switchTheme(){
  const mode=BR.toggleTheme();
  const moon='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>';
  const sun='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  document.getElementById('themeBtn').innerHTML=(mode==='light'?sun:moon)+'主题';
}
const glossBtn=document.getElementById("glossBtn");
function openGloss(){setMode('glossary',glossBtn);}
function closeGloss(){
  const cur=document.body.classList.contains('mode-original')?'original':'summary';
  const target=document.querySelector(`.view-seg .seg-btn[data-mode="${cur}"]`);
  if(target)setMode(cur,target);
}
function toggleGloss(){setMode('glossary',glossBtn);}

/* ===== 初始化 ===== */
renderHero(); renderContent(); renderOriginal(); renderGlossary(); renderFooter();
BR.autowrap(document.querySelectorAll('#originalSection .og-row .en'));
BR.mountTooltips(document);

/* TOC + 滚动追踪 */
const toc=document.getElementById("toc");
let secList=document.querySelectorAll("section[data-toc]");
let tocLinks=[];
secList.forEach((s,i)=>{s.id="sec"+i; s.style.scrollMarginTop="70px";});
tocLinks=renderToc(sectionAnchors());
BR.initProgress((pct,sc,max)=>{
  if(document.body.classList.contains("gloss-open")){
    let gc=0;
    const groups=document.querySelectorAll(".gloss-group");
    groups.forEach((g,i)=>{if(g.getBoundingClientRect().top<160)gc=i;});
    if(max<=0||sc>=max-2){gc=groups.length-1;}
    tocLinks.forEach((a,i)=>a.classList.toggle("active",i===gc));
    return;
  }
  let cur=0; secList.forEach((s,i)=>{if(s.getBoundingClientRect().top<160)cur=i;});
  if(max<=0||sc>=max-2){cur=secList.length-1;}
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
});
scrollToActiveFirstAnchor();
</script>
