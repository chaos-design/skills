<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__PAGE_TITLE__</title>
<!-- bilingual-reader-template
name: blueprint-grid
style: 独立整页模板 · 工程蓝图 / engineering blueprint
structure: 图纸标题栏 Hero + 青色细网格底图 + 技术规格表双列对照 + 坐标编号/尺寸标注/角标 + 右侧固定锚点
-->
<style>
  :root{
    --bg:#0a1929; --panel:#0e2236; --panel2:#123049; --border:#1f4a6b;
    --text:#e3f2fd; --muted:#7fa6c4; --en:#bfe3f5; --zh:#dceefb;
    --accent:#00d8ff; --accent2:#5ad1a8; --green:#5ad1a8; --tip-bg:#081522;
    --accent-ink:#06121f; --accent2-ink:#06121f; --accent-shadow:rgba(0,216,255,.30);
    --hl:rgba(0,216,255,.14);
    --radius:2px; --radius-lg:3px; --radius-sm:2px;
    --hero-angle:135deg;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.85; transition:background .3s,color .3s;
    background-image:
      linear-gradient(color-mix(in srgb,var(--accent) 9%,transparent) 1px,transparent 1px),
      linear-gradient(90deg,color-mix(in srgb,var(--accent) 9%,transparent) 1px,transparent 1px),
      linear-gradient(color-mix(in srgb,var(--accent) 4%,transparent) 1px,transparent 1px),
      linear-gradient(90deg,color-mix(in srgb,var(--accent) 4%,transparent) 1px,transparent 1px);
    background-size:120px 120px,120px 120px,24px 24px,24px 24px}
  __RUNTIME_CSS__

  /* —— monospace 工程字体族 —— */
  .mono{font-family:"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,"Courier New",monospace}

  /* —— 顶栏：图纸标题栏固定条 —— */
  header{position:sticky; top:0; z-index:900; backdrop-filter:blur(8px);
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    border-bottom:1px solid var(--accent); padding:10px 22px;
    display:flex; align-items:center; gap:14px;
    box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 30%,transparent),0 6px 18px rgba(0,0,0,.4)}
  header h1{font-size:15px; margin:0; flex:1; min-width:140px; font-weight:700; letter-spacing:1px;
    font-family:"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace; text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  header h1::before{content:"// "; color:var(--accent)}
  header h1 span{color:var(--accent)}
  .ctrls{display:flex; gap:10px; align-items:center}
  .seg{display:inline-flex; border:1px solid var(--border); border-radius:0; padding:0; gap:0; overflow:hidden}
  .seg-btn{display:inline-flex; align-items:center; gap:6px; background:transparent; color:var(--muted);
    border:none; cursor:pointer; padding:6px 14px; font-size:13px;
    font-family:"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace; letter-spacing:.5px;
    transition:.2s; white-space:nowrap; text-transform:uppercase; border-radius:0}
  .seg-btn .ico{width:15px; height:15px; flex-shrink:0}
  .seg-btn:hover{color:var(--accent); background:var(--hl)}
  .seg-btn.active{background:var(--accent); color:var(--accent-ink); font-weight:700}

  .wrap{max-width:1020px; margin:0 auto; padding:34px 30px 90px}

  /* —— Hero：图纸标题栏 title block —— */
  .hero{position:relative; border:1px solid var(--accent);
    background:linear-gradient(var(--hero-angle),color-mix(in srgb,var(--panel) 90%,var(--accent) 5%),var(--panel2));
    padding:36px 40px 64px; margin-bottom:46px; box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--accent) 10%,transparent)}
  /* 四角角标 corner ticks */
  .hero::before,.hero::after{content:""; position:absolute; width:16px; height:16px; pointer-events:none}
  .hero::before{top:8px; left:8px; border-top:2px solid var(--accent); border-left:2px solid var(--accent)}
  .hero::after{bottom:8px; right:8px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent)}
  .hero h2{margin:0 0 8px; font-size:30px; line-height:1.35; letter-spacing:.5px; font-weight:800}
  .hero .meta{color:var(--accent); font-size:13px; letter-spacing:2px; text-transform:uppercase;
    font-family:"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace}
  .hero .en{color:var(--en); margin:16px 0 0; font-size:16px; line-height:1.7}
  .hero .zh{color:var(--zh); margin:6px 0 0; font-size:16px; line-height:1.8}
  /* 右下角 图号/比例/日期 元信息格 */
  .hero .titleblock{position:absolute; right:18px; bottom:16px; display:flex;
    border:1px solid var(--accent); font-family:"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace}
  .hero .titleblock div{padding:3px 12px; font-size:11px; letter-spacing:1px; color:var(--muted);
    border-left:1px solid var(--border)}
  .hero .titleblock div:first-child{border-left:none}
  .hero .titleblock div b{display:block; color:var(--accent); font-size:12px; letter-spacing:.5px}

  .block{margin-bottom:48px; position:relative}
  /* 章节坐标编号 + 尺寸标注线 */
  .sec-title{display:flex; align-items:center; gap:14px; font-size:20px; font-weight:800; letter-spacing:.5px;
    margin:0 0 20px; padding:0 0 12px; border-bottom:1px dashed var(--border); position:relative}
  .sec-title::after{content:""; position:absolute; left:0; bottom:-1px; width:90px; height:2px; background:var(--accent)}
  .sec-title .num{background:transparent; color:var(--accent); min-width:46px; height:30px; padding:0 9px;
    border:1px solid var(--accent); border-radius:0; display:grid; place-items:center; font-size:13px; font-weight:800;
    font-family:"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace; letter-spacing:1px}
  .note{color:var(--muted); font-size:13.5px; margin:-8px 0 16px; font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; letter-spacing:.3px}
  .note::before{content:"NOTE: "; color:var(--accent)}

  /* —— 速览：技术说明卡 —— */
  .sum-lead{border-left:2px solid var(--accent); padding:10px 0 10px 20px; font-size:16px; margin-bottom:22px; color:var(--text)}
  .sum-lead b{color:var(--accent)}
  .sum-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px}
  .sum-card{background:var(--panel); border:1px solid var(--border); border-radius:0;
    padding:18px 20px; position:relative}
  .sum-card::before{content:""; position:absolute; top:0; left:0; width:100%; height:2px;
    background:linear-gradient(90deg,var(--accent),transparent)}
  .sum-card::after{content:""; position:absolute; top:7px; right:7px; width:9px; height:9px;
    border-top:1px solid var(--accent2); border-right:1px solid var(--accent2)}
  .sum-card .ico{font-size:22px; margin-bottom:6px}
  .sum-card h4{margin:0 0 6px; font-size:15px; color:var(--accent); letter-spacing:.5px;
    font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  .sum-card p{margin:0; font-size:14.5px; color:var(--en); line-height:1.8}

  /* —— Sections rows：技术规格表双列对照 —— */
  .study-table{display:flex; flex-direction:column; border:1px solid var(--border); background:var(--panel)}
  .study-row{display:grid; grid-template-columns:40px 1fr 1fr; align-items:stretch;
    border-bottom:1px solid var(--border); transition:.15s}
  .study-row:last-child{border-bottom:none}
  .study-row:hover{background:var(--hl)}
  .study-row .no{display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--accent);
    font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; letter-spacing:.5px;
    border-right:1px solid var(--border); background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .study-row .en{padding:15px 20px; color:var(--en); font-size:15.5px; line-height:1.85;
    border-right:1px dashed var(--border)}
  .study-row .zh{padding:15px 20px; color:var(--zh); font-size:16px; line-height:1.9}

  /* —— Cards：组件规格卡 —— */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:0;
    padding:18px 20px; transition:.2s; position:relative}
  .card:hover{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .card .top{display:flex; align-items:center; gap:12px}
  .card .tag{width:34px; height:34px; border-radius:0; border:1px solid var(--accent2); color:var(--accent2);
    background:transparent; display:grid; place-items:center; font-size:15px; font-weight:800; flex-shrink:0;
    font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  .card h4{margin:0; font-size:15px; color:var(--accent); letter-spacing:.5px;
    font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  .card .zhname{font-size:13.5px; color:var(--muted)}
  .card .body{font-size:14.5px; color:var(--en); line-height:1.8; margin-top:12px}
  .card .when{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); color:var(--zh)}

  /* —— Quiz —— */
  .quiz{background:var(--panel); border:1px solid var(--border); border-radius:0; padding:22px 24px}
  .quiz .q-txt{font-size:17px; font-weight:700; margin-bottom:14px}
  .quiz .opt{display:block; width:100%; text-align:left; background:transparent; border:1px solid var(--border);
    border-radius:0; padding:12px 16px; margin-bottom:10px; cursor:pointer; color:var(--text);
    font-size:15px; font-family:inherit; transition:.15s}
  .quiz .opt:hover{border-color:var(--accent); background:var(--hl)}
  .quiz .opt.correct{background:rgba(90,209,168,.18); border-color:var(--green)}
  .quiz .opt.wrong{background:rgba(255,90,90,.18); border-color:#ff5a5a}
  .quiz .fb{margin-top:10px; font-size:14px; color:var(--muted); min-height:20px}
  .quiz-nav{display:flex; justify-content:space-between; align-items:center; margin-top:12px}
  .quiz-nav small{color:var(--muted); font-size:13px; font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  .btn{background:transparent; color:var(--text); border:1px solid var(--border); padding:8px 18px;
    border-radius:0; cursor:pointer; font-size:14px; font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; letter-spacing:.5px}
  .btn:hover{border-color:var(--accent); color:var(--accent)}

  /* —— Summary box：核心规格表 —— */
  .summary-box{border:1px solid var(--accent); border-radius:0;
    background:linear-gradient(var(--hero-angle),var(--panel),var(--panel2)); padding:26px 28px;
    box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--accent) 8%,transparent)}
  .summary-box h3{margin:0 0 16px; color:var(--accent); font-size:18px; letter-spacing:1px;
    font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; text-transform:uppercase}
  .summary-box .q{font-size:16px; border-left:2px solid var(--accent); padding-left:16px;
    margin:10px 0; color:var(--text); line-height:1.85}
  .summary-box .q.zh{border-left-color:var(--accent2); color:var(--zh)}
  .pri-strip{display:flex; flex-wrap:wrap; gap:16px; margin-top:18px}
  .pri{flex:1 1 190px; background:var(--panel); border:1px solid var(--border); border-radius:0; padding:16px 18px; position:relative}
  .pri::after{content:""; position:absolute; bottom:6px; left:6px; width:9px; height:9px;
    border-bottom:1px solid var(--accent2); border-left:1px solid var(--accent2)}
  .pri .big{font-size:24px; font-weight:800; color:var(--accent); font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  .pri h4{margin:6px 0; font-size:14px; color:var(--accent2); letter-spacing:.5px;
    font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  .pri p{margin:0; font-size:13.5px; color:var(--en); line-height:1.7}

  /* —— Original：分组规格表 —— */
  .og-h{margin:28px 0 14px; padding:9px 18px; font-size:15px; font-weight:800; color:var(--accent); letter-spacing:1px;
    border-left:2px solid var(--accent); background:linear-gradient(90deg,var(--hl),transparent);
    font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace; text-transform:uppercase}
  .og-row{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--border); border-radius:0;
    margin-bottom:-1px; overflow:hidden}
  .og-row .en{padding:15px 20px; color:var(--en); font-size:15px; line-height:1.85; border-right:1px dashed var(--border)}
  .og-row .zh{padding:15px 20px; color:var(--zh); font-size:15.5px; line-height:1.9}

  /* —— Glossary —— */
  #glossary{display:none}
  #glossary.show{display:block}
  .gloss-group{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:28px 0 14px; padding-bottom:10px; border-bottom:1px dashed var(--border)}
  .gloss-group .gg-desc{font-size:15px; color:var(--text); font-weight:700; letter-spacing:.5px}
  .gloss-group .gg-count{display:inline-flex; align-items:center; margin-left:6px; padding:2px 9px; border:1px solid color-mix(in srgb,var(--accent2) 24%,var(--border)); border-radius:999px; background:color-mix(in srgb,var(--accent2) 10%,transparent); font-size:12px; font-weight:800; line-height:1.4; color:var(--muted); font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  .gloss-grid-inner{--gloss-card-min:240px; --gloss-card-max:340px; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--gloss-card-min)),var(--gloss-card-max))); justify-content:start; gap:16px; margin-bottom:14px}
  .gloss-item{width:100%; min-width:0; max-width:var(--gloss-card-max); background:var(--panel); border:1px solid var(--border); border-radius:0; padding:18px 20px; position:relative}
  .gloss-item::before{content:""; position:absolute; top:6px; right:6px; width:9px; height:9px;
    border-top:1px solid var(--accent); border-right:1px solid var(--accent)}
  .gloss-item .grow{display:flex; align-items:center; gap:10px}
  .gloss-item .word,.gloss-item .gw{display:inline-block; font-weight:900; color:var(--accent); font-size:23px; line-height:1.05; letter-spacing:.08em; text-shadow:0 0 14px color-mix(in srgb,var(--accent) 32%,transparent);
    font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  .gloss-item .gsub{display:flex; align-items:center; gap:10px; margin-top:6px}
  .gloss-item .gipa{color:var(--accent2); font-size:13.5px; font-family:Georgia,serif}
  .gloss-item .gpos{font-size:12px; background:var(--accent2); color:var(--accent2-ink); padding:1px 8px; border-radius:0; font-style:italic}
  .gloss-item .gdef{font-size:15px; color:var(--text); margin-top:10px; line-height:1.8}
  .gloss-item .geg{font-size:13.5px; color:var(--en); font-style:italic; margin-top:8px; line-height:1.7}
  .gloss-item .geg .egzh{display:block; color:var(--muted); font-style:normal; margin-top:4px}

  footer{text-align:center; color:var(--muted); font-size:12.5px; opacity:.75; padding:18px; border-top:1px solid var(--border);
    margin-top:30px; letter-spacing:1px; font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  footer a{color:var(--accent2)}
  footer a:hover{color:var(--accent)}

  /* —— TOC：右侧固定坐标锚点 —— */
  .toc{position:fixed; right:14px; top:50%; transform:translateY(-50%); z-index:800;
    display:flex; flex-direction:column; align-items:center; gap:12px; padding:14px 10px;
    background:color-mix(in srgb,var(--panel) 82%,transparent); border:1px solid var(--accent); border-radius:0; backdrop-filter:blur(8px)}
  .toc a{width:11px; height:11px; border:1px solid var(--border); background:transparent; cursor:pointer; transition:.25s; position:relative; flex-shrink:0}
  .toc a:hover{border-color:var(--accent2); background:var(--accent2); transform:scale(1.35)}
  .toc a.active{background:var(--accent); border-color:var(--accent); height:26px}
  .toc a span{position:absolute; right:22px; top:50%; transform:translateY(-50%) translateX(6px); white-space:nowrap;
    background:var(--panel); border:1px solid var(--accent); padding:4px 12px; border-radius:0; font-size:12px;
    opacity:0; pointer-events:none; transition:.2s; color:var(--text); letter-spacing:.5px;
    font-family:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
  .toc a:hover span{opacity:1; transform:translateY(-50%)}

  body.mode-original .summary-view{display:none}
  body.mode-original #originalSection{display:block}
  #originalSection{display:none}
  body.mode-original .toc,body.gloss-open .toc{display:none}
  body.gloss-open .hero,body.gloss-open .summary-view,body.gloss-open #originalSection{display:none!important}

  @media(max-width:760px){
    .toc{display:none}
    .study-row{grid-template-columns:30px 1fr}
    .study-row .en{border-right:none; border-bottom:1px dashed var(--border)}
    .study-row .zh{grid-column:2 / -1}
    .og-row{grid-template-columns:1fr}
    .og-row .en{border-right:none; border-bottom:1px dashed var(--border)}
    .hero .titleblock{position:static; display:inline-flex; margin-top:18px}
    .hero{padding-bottom:36px}
  }

  .doc-title-link{display:block;flex:1;min-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}
  .doc-title-link:hover{color:var(--accent)}
  .reader-header .ctrls{margin-left:auto;justify-content:flex-end}
  .theme-group{display:inline-flex;align-items:center}
  .theme-btn{display:inline-flex;align-items:center;gap:6px}
  .theme-btn .ico{width:15px;height:15px;flex-shrink:0}

</style>
</head>
<body>
<div id="progress"></div>

<header class="reader-header">
  <a class="doc-title-link" href="__SOURCE_URL__" target="_blank" rel="noopener" aria-label="打开原文链接">__HEADER_TITLE__</a>
  <div class="ctrls" aria-label="阅读功能区">
    <div class="seg view-seg" role="group" aria-label="阅读视图">
      <button class="seg-btn active" type="button" data-mode="summary" onclick="setMode('summary',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg>精读</button>
      <button class="seg-btn" type="button" data-mode="original" onclick="setMode('original',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.8-1.2-4-1.8-6.5-1.8C4.7 4.2 4 4.9 4 5.7v11.6c0 .8.7 1.5 1.5 1.4C8 18.6 10.2 19.2 12 20.4"/><path d="M12 6c1.8-1.2 4-1.8 6.5-1.8.8 0 1.5.7 1.5 1.5v11.6c0 .8-.7 1.5-1.5 1.4-2.5-.1-4.7.5-6.5 1.7"/><path d="M12 6v14.4"/></svg>原文</button>
      <button class="seg-btn" type="button" id="glossBtn" data-mode="glossary" onclick="setMode('glossary',this)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H18a2 2 0 0 1 2 2v13.5"/><path d="M4 5.5v13A1.5 1.5 0 0 0 5.5 20H20"/><path d="M8 8.5h7M8 12h7"/></svg>词汇</button>
    </div>
    <div class="theme-group" role="group" aria-label="主题设置">
      <button class="btn theme-btn" type="button" id="themeBtn" onclick="switchTheme()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>主题</button>
    </div>
  </div>
</header>

<nav class="toc" id="toc"></nav>

<div class="wrap">
  <div class="hero" id="hero"></div>

  <section id="glossary">
    <h3 class="sec-title"><span class="num">G-00</span>核心词汇表</h3>
    <p class="note">全文重点词汇按 CEFR 分级，点 🔊 朗读。点击顶部「精读」或「原文」可切换回阅读视图。</p>
    <div id="glossGrid"></div>
  </section>

  <div id="contentHost"></div>

  <section id="originalSection">
    <h3 class="sec-title"><span class="num">O-00</span><span id="ogTitle"></span></h3>
    <p class="note" id="ogMeta"></p>
    <div id="originalHost"></div>
  </section>
</div>

<footer id="footer"></footer>

<script>

window.BILINGUAL_READER_THEME = __THEME_JSON__;
const DATA = window.BILINGUAL_READER_DATA, THEME = window.BILINGUAL_READER_THEME;

<script>
/* ===== blueprint-grid：工程蓝图的页面骨架与渲染 ===== */
const esc = BR.escapeHtml;

function renderHero(){
  const h=DATA.hero||{};
  // const dateStr=new Date().toISOString().slice(0,10);
  document.getElementById('hero').innerHTML=
    `<h2>${esc(h.title)}</h2>`+
    (h.meta?`<div class="meta">${esc(h.meta)}</div>`:'')+
    (h.en?`<p class="en">${esc(h.en)}</p>`:'')+
    (h.zh?`<p class="zh">${esc(h.zh)}</p>`:'');
    // + `<div class="titleblock"><div>日期<b>${dateStr}</b></div></div>`;
}

function sectionBlock(inner,toc,title,num){
  return `<section class="summary-view block" data-toc="${esc(toc||'')}" data-title="${esc(title||toc||'')}">
      <h3 class="sec-title"><span class="num">${esc(num||'')}</span>${esc(title||'')}</h3>${inner}</section>`;
}

function renderContent(){
  const host=document.getElementById('contentHost');
  let html='';
  const s=DATA.summary||{};
  if(s.lead||s.cards){
    let inner=(s.lead?`<div class="sum-lead">${s.lead}</div>`:'')+
      `<div class="sum-grid">`+(s.cards||[]).map(c=>
        `<div class="sum-card"><div class="ico">${esc(c.icon||'')}</div><h4>${esc(c.title)}</h4><p>${esc(c.body)}</p></div>`).join('')+`</div>`;
    html+=sectionBlock(inner,'速览','全文速览','A-00');
  }
  (DATA.sections||[]).forEach(sec=>{
    let inner='';
    if(sec.type==='cards'){
      inner=(sec.note?`<p class="note">${esc(sec.note)}</p>`:'')+`<div class="cards" data-cards="1"></div>`;
    }else if(sec.type==='quiz'){
      inner=`<div class="quiz" data-quiz="1"></div>`;
    }else if(sec.type==='summary'){
      inner=summaryBoxHtml(sec.box||{});
    }else{
      inner=`<div class="study-table">`+(sec.rows||[]).map((r,i)=>
        `<div class="study-row"><div class="no">${String(i+1).padStart(2,'0')}</div>`+
        `<div class="en">${r.en}</div><div class="zh">${esc(r.zh)}</div></div>`).join('')+`</div>`;
    }
    html+=sectionBlock(inner,sec.toc,sec.title,sec.num);
  });
  host.innerHTML=html;
  hydrateCards(); hydrateQuiz();
}

function summaryBoxHtml(box){
  const pri=(box.principles||[]).map(p=>
    `<div class="pri"><div class="big">${esc(p.big||'')}</div><h4>${esc(p.title||'')}</h4>`+
    `<p>${esc(p.en||'')}<br><span style="color:var(--zh)">${esc(p.zh||'')}</span></p></div>`).join('');
  return `<div class="summary-box"><h3>${esc(box.heading||'一句话精髓')}</h3>`+
    (box.enQuote?`<div class="q">${esc(box.enQuote)}</div>`:'')+
    (box.zhQuote?`<div class="q zh">${esc(box.zhQuote)}</div>`:'')+
    (box.intro?`<p style="font-size:14px;color:var(--en);margin:10px 0 0">${esc(box.intro)}</p>`:'')+
    (pri?`<div class="pri-strip">${pri}</div>`:'')+`</div>`;
}

function hydrateCards(){
  const sec=(DATA.sections||[]).find(s=>s.type==='cards');
  const host=document.querySelector('[data-cards]');
  if(!sec||!host)return;
  (sec.cards||[]).forEach(p=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=`<div class="top"><span class="tag">${esc(p.ico||'')}</span><div><h4>${esc(p.en)}</h4>`+
      (p.zh?`<div class="zhname">${esc(p.zh)}</div>`:'')+`</div></div>`+
      `<div class="body">${esc(p.body||'')}${p.when?`<div class="when">${esc(p.when)}</div>`:''}</div>`;
    host.appendChild(c);
  });
}

function hydrateQuiz(){
  const sec=(DATA.sections||[]).find(s=>s.type==='quiz');
  const qz=document.querySelector('[data-quiz]');
  if(!sec||!qz)return;
  const QUIZ=sec.quiz||[]; let qi=0,score=0;
  function render(){
    const item=QUIZ[qi];
    qz.innerHTML=`<div class="q-txt">Q${qi+1}. ${esc(item.q)}</div>`+
      item.opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')+
      `<div class="fb"></div><div class="quiz-nav"><small>第 ${qi+1}/${QUIZ.length} 题 · 得分 ${score}</small><button class="btn" id="nextQ" style="display:none">下一题 →</button></div>`;
    let answered=false;
    qz.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{
        if(answered)return; answered=true;
        const i=+b.dataset.i;
        if(i===item.a){b.classList.add('correct');score++;}
        else{b.classList.add('wrong');qz.querySelectorAll('.opt')[item.a].classList.add('correct');}
        qz.querySelector('.fb').textContent=item.fb||'';
        const nb=document.getElementById('nextQ');
        if(qi<QUIZ.length-1){nb.style.display='inline-block';nb.onclick=()=>{qi++;render();};}
        else{nb.style.display='inline-block';nb.textContent='重新测验 ↺';nb.onclick=()=>{qi=0;score=0;render();};
          qz.querySelector('.fb').textContent+=`  🎉 完成！最终得分 ${score}/${QUIZ.length}`;}
      };
    });
  }
  render();
}

function renderOriginalRow(r){
  if(r.type==='image'){
    const cap=r.caption?`<figcaption>${esc(r.caption)}</figcaption>`:'';
    return `<figure class="og-media"><img src="${esc(r.src||'')}" alt="${esc(r.alt||'')}" width="720" height="405" loading="lazy" decoding="async" style="display:block;width:min(720px,100%);height:405px;object-fit:contain;margin:0 auto;">${cap}</figure>`;
  }
  return `<div class="og-row"><div class="en">${esc(r.en)}</div><div class="zh">${esc(r.zh)}</div></div>`;
}

function renderOriginal(){
  const o=DATA.original||{};
  document.getElementById('ogTitle').textContent=o.title||'原文全文对照';
  document.getElementById('ogMeta').textContent=o.meta||'';
  document.getElementById('originalHost').innerHTML=(o.groups||[]).map(g=>
    `<div class="og-h">${esc(g.group)}</div>`+
    (g.rows||[]).map(renderOriginalRow).join('')
  ).join('');
}

function renderGlossary(){
  const host=document.getElementById('glossGrid');
  const groups=BR.groupGlossary(); const links=[];
  host.innerHTML=groups.map(g=>{
    const gid='gloss-'+g.lvc;
    links.push({id:gid,label:g.level});
    const items=g.items.map(d=>
      `<div class="gloss-item"><div class="grow"><span class="gw">${esc(d.w)}</span>`+
      `<button class="speak" title="朗读" data-speak="${esc(d.w)}">🔊</button></div>`+
      `${(d.ipa || (d.pos && d.pos !== "术语")) ? `<div class="gsub">${d.ipa ? `<span class="gipa">${esc(d.ipa)}</span>` : ""}${d.pos && d.pos !== "术语" ? `<span class="gpos">${esc(d.pos)}</span>` : ""}</div>` : ""}`+
      `<div class="gdef">${esc(d.def)}</div><div class="geg">🗣 ${esc(d.eg||'')}`+
      `${d.egzh?`<span class="egzh">${esc(d.egzh)}</span>`:''}</div></div>`).join('');
    return `<div class="gloss-group" id="${gid}" style="scroll-margin-top:74px"><span class="lv lv-${g.lvc}">${esc(g.level)}</span>`+
      `<span class="gg-desc">${esc(g.desc)}</span><span class="gg-count">${g.items.length} 词</span></div>`+
      `<div class="gloss-grid-inner">${items}</div>`;
  }).join('');
  host.querySelectorAll('[data-speak]').forEach(b=>b.addEventListener('click',e=>BR.speak(b.getAttribute('data-speak'),e)));
  return links;
}

function renderFooter(){
  const f=DATA.footer||{};
  document.getElementById('footer').innerHTML=f.sourceUrl?
    `原文：<a href="${esc(f.sourceUrl)}" target="_blank" rel="noopener">《${esc(f.sourceText||f.sourceUrl)}》</a>`:esc(f.sourceText||'');
}

/* ===== 控制：视图 / 主题 / 词汇表 ===== */
function setMode(m,btn){
  const glossary=document.getElementById('glossary');
  document.body.classList.toggle('mode-original',m==='original');
  document.body.classList.toggle('gloss-open',m==='glossary');
  if(glossary)glossary.classList.toggle('show',m==='glossary');
  document.querySelectorAll('.view-seg .seg-btn[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  if(m==='glossary')scrollToGlossaryTop('smooth');
  else scrollToActiveFirstAnchor('smooth');
}
function switchTheme(){
  const mode=BR.toggleTheme();
  const moon='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>';
  const sun='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  document.getElementById('themeBtn').innerHTML=(mode==='light'?sun:moon)+'主题';
}
const glossBtn=document.getElementById("glossBtn");
function openGloss(){setMode('glossary',glossBtn);}
function closeGloss(){
  const cur=document.body.classList.contains('mode-original')?'original':'summary';
  const target=document.querySelector(`.view-seg .seg-btn[data-mode="${cur}"]`);
  if(target)setMode(cur,target);
}
function toggleGloss(){setMode('glossary',glossBtn);}

function renderToc(anchors){
  toc.innerHTML='';
  return anchors.map(a=>{
    const link=document.createElement('a');
    link.innerHTML=`<span>${esc(a.label)}</span>`;
    link.onclick=()=>a.el.scrollIntoView({behavior:'smooth',block:'start'});
    toc.appendChild(link);
    return link;
  });
}

function sectionAnchors(){
  return Array.from(secList).map(s=>({el:s,label:s.dataset.title||s.dataset.toc}));
}


/* ===== 初始化 ===== */
const toc=document.getElementById('toc');
let tocLinks=[];
let secList=[];
renderHero(); renderContent(); renderOriginal(); renderGlossary(); renderFooter();
BR.autowrap(document.querySelectorAll('#contentHost .sum-lead,#contentHost .sum-card p,#contentHost .study-row .en,#contentHost .card .body,#contentHost .summary-box .q,#contentHost .pri p'));
BR.autowrap(document.querySelectorAll('#originalSection .og-row .en'));
BR.mountTooltips(document);

secList=document.querySelectorAll('section[data-toc]');
secList.forEach((s,i)=>{s.id='sec'+i; s.style.scrollMarginTop='74px';
});
tocLinks=renderToc(sectionAnchors());
BR.initProgress((pct,sc,max)=>{
  if(document.body.classList.contains('gloss-open')){
    tocLinks.forEach(a=>a.classList.remove('active'));
    return;
  }
  let cur=0; secList.forEach((s,i)=>{if(s.getBoundingClientRect().top<160)cur=i;});
  if(max<=0||sc>=max-2){cur=secList.length-1;}
  tocLinks.forEach((a,i)=>a.classList.toggle('active',i===cur));
});
scrollToActiveFirstAnchor();
</script>
</body>
</html>
